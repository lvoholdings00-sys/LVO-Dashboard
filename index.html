<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVO Command Center</title>

<!-- CLERK -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubHZvLWNsb3VkLmNsb3VkJA"
  src="https://clerk.lvo-cloud.cloud/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0a0a0a;--surface:#111111;--card:#161616;--card-hover:#1c1c1c;
  --border:#2a2a2a;--border-gold:#b8953f44;--gold:#b8953f;--gold-light:#d4a853;
  --gold-dim:#7a5f1a;--gold-glow:#b8953f18;--text:#e8e6e0;--text-dim:#9a9690;
  --text-muted:#5a5650;--red:#8b2020;--red-light:#c0392b;--green:#2d6a4a;
  --sidebar-w:224px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:13px}
body{background:var(--black);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:0.3}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* LOADING SCREEN */
#loading-screen{position:fixed;inset:0;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:20px}
.loading-spinner{width:40px;height:40px;border:1px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:11px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase}

#app{display:none;height:100vh;overflow:hidden}
#app.visible{display:flex;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:8px;padding:14px 22px;border-bottom:1px solid var(--border);cursor:pointer;color:var(--text-muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:color .2s,background .2s}
.back-btn:hover{color:var(--gold);background:var(--gold-glow)}
.back-btn svg{flex-shrink:0}
.sidebar-logo{padding:20px 22px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo-text{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;letter-spacing:.35em;color:var(--gold);line-height:1;margin-bottom:5px}
.sidebar-logo-sub{font-size:8px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;line-height:1.5}
.sidebar-nav{flex:1;padding:10px 0}
.nav-section-label{font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;padding:14px 22px 6px;opacity:.6}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 22px;cursor:pointer;transition:background .15s,color .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--gold-glow)}
.nav-item.active{background:var(--gold-glow);border-left-color:var(--gold)}
.nav-icon{width:15px;height:15px;color:var(--text-muted);flex-shrink:0}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{color:var(--gold)}
.nav-label{font-size:11.5px;color:var(--text-dim);letter-spacing:.04em}
.nav-sub{font-size:8px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.nav-item.active .nav-label,.nav-item:hover .nav-label{color:var(--text)}
.sidebar-bottom{padding:18px 22px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.auth-status{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase}
.auth-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

/* CLERK OVERRIDES */
.cl-rootBox{font-family:'DM Mono',monospace!important}
.cl-userButtonPopoverCard{background:var(--surface)!important;border:1px solid var(--border-gold)!important;border-radius:0!important}
.cl-userButtonPopoverActionButton{border-radius:0!important;color:var(--text-dim)!important}
.cl-userButtonPopoverActionButton:hover{background:var(--gold-glow)!important;color:var(--gold)!important}
.cl-userButtonPopoverActionButtonText{font-family:'DM Mono',monospace!important;font-size:11px!important}
.cl-userButtonBox{border-radius:0!important}
.cl-avatarBox{border-radius:0!important;border:1px solid var(--border-gold)!important}

/* MAIN */
#main{flex:1;height:100vh;overflow-y:auto;background:var(--black);min-width:0}
.page{display:none;padding:36px 44px 60px;animation:pageIn .25s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* TOP BAR */
.top-bar{position:sticky;top:0;background:var(--black);border-bottom:1px solid var(--border);padding:13px 44px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.top-bar-left{font-size:9px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase}
.top-bar-right{display:flex;align-items:center;gap:14px}
.top-bar-user{font-size:9px;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}

/* PAGE HEADER */
.page-header{margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:20px}
.page-title{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.page-title-main{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--text);letter-spacing:.02em;line-height:1}
.page-title-tag{font-size:9px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
.page-dba{font-size:9px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.page-desc{font-size:12px;color:var(--text-muted);line-height:1.65;max-width:640px}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-2{grid-template-columns:repeat(2,1fr)}
.kpi-card{background:var(--card);border:1px solid var(--border);padding:22px;transition:border-color .2s,background .2s}
.kpi-card:hover{border-color:var(--border-gold);background:var(--card-hover)}
.kpi-label{font-size:8px;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.kpi-value{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:var(--text);line-height:1;margin-bottom:4px}
.kpi-sub{font-size:9px;color:var(--text-muted);letter-spacing:.1em}
.kpi-sub.gold{color:var(--gold)}
.kpi-sub.red{color:var(--red-light)}

/* SECTION */
.section{background:var(--card);border:1px solid var(--border);padding:22px;margin-bottom:18px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);margin-bottom:18px;letter-spacing:.04em}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;padding:0 14px 10px 0;text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:12px 14px 12px 0;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:11.5px}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{color:var(--text)}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.badge-active{color:var(--gold);border-color:var(--gold-dim);background:#b8953f08}
.badge-pending{color:#c8a050;border-color:#8b6020;background:#8b60200a}
.badge-development{color:var(--text-dim);border-color:var(--border);background:transparent}
.badge-complete,.badge-completed{color:#6aaa80;border-color:#2d6a4a;background:#2d6a4a0a}
.badge-blocked,.badge-alert,.badge-overdue{color:#e05555;border-color:var(--red);background:#8b20200a}
.badge-secured{color:#6aaa80;border-color:#2d6a4a;background:#2d6a4a0a}
.badge-submitted{color:#7090c0;border-color:#304060;background:#3040600a}
.badge-review{color:#c0a020;border-color:#806800;background:#8068000a}
.badge-sold{color:var(--text-muted);border-color:var(--border);background:transparent}
.badge-operational{color:var(--gold);border-color:var(--gold-dim);background:#b8953f08}
.badge-gold{color:var(--gold-light);border-color:var(--gold-dim);background:#b8953f0a}
.badge-silver{color:#a0a0b0;border-color:#606070;background:transparent}
.badge-bronze{color:#c09060;border-color:#7a5030;background:transparent}

/* BUTTONS */
.btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:9px 18px;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--black);font-weight:500}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:5px 11px;font-size:8px}
.btn-danger{background:transparent;border:1px solid var(--red);color:#e05555;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:4px 8px;cursor:pointer;transition:all .2s}
.btn-danger:hover{background:var(--red);color:var(--text)}

/* TABS */
.tabs{display:flex;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab{padding:9px 18px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;margin-bottom:-1px}
.tab:hover{color:var(--text-dim)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}
.tab-content.active{display:block}

/* LAYOUT */
.two-col{display:grid;grid-template-columns:1fr 360px;gap:18px}

/* ACTIVITY */
.activity-feed{display:flex;flex-direction:column}
.activity-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);margin-top:4px;flex-shrink:0}
.activity-dot.red{background:var(--red-light)}
.activity-dot.green{background:var(--green)}
.activity-dot.gold{background:var(--gold)}
.activity-time{font-size:9px;color:var(--text-muted);letter-spacing:.1em;white-space:nowrap}
.activity-text{font-size:11.5px;color:var(--text-dim);line-height:1.5}

/* PROGRESS */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-bar{flex:1;height:2px;background:var(--border)}
.progress-fill{height:100%;background:var(--gold);transition:width .4s}
.progress-label{font-size:10px;color:var(--gold);min-width:34px;text-align:right}

/* FORMS */
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-label{display:block;font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-bottom:7px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:9px 10px;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-bottom-color:var(--gold)}
.form-input::placeholder{color:var(--text-muted)}
.form-select option{background:var(--surface)}
.form-textarea{resize:vertical;min-height:75px}

/* REQUEST BAR */
.request-bar{display:flex;gap:10px;margin-bottom:24px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-top:1px solid var(--border-gold);align-items:flex-end}
.request-bar select,.request-bar input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:5px 6px;outline:none;transition:border-color .2s}
.request-bar input{flex:1}
.request-bar input::placeholder{color:var(--text-muted)}
.request-bar input:focus,.request-bar select:focus{border-bottom-color:var(--gold)}
.request-bar select{color:var(--text-dim);min-width:170px;background:var(--card)}
.request-bar select option{background:var(--surface)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:#0a0a0acc;z-index:500;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-gold);width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:30px;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--text);letter-spacing:.04em}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:0;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

/* NOTIF PANEL */
.notif-panel{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:400;transition:right .3s ease;display:flex;flex-direction:column}
.notif-panel.open{right:0}
.notif-panel-header{padding:22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-panel-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:.04em}
.notif-panel-body{flex:1;overflow-y:auto;padding:14px 22px}
.notif-entry{padding:13px 0;border-bottom:1px solid var(--border)}
.notif-entry:last-child{border-bottom:none}
.notif-entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.notif-division{font-size:8px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.notif-time{font-size:8px;color:var(--text-muted)}
.notif-type{font-size:10px;color:var(--text);letter-spacing:.08em;margin-bottom:3px}
.notif-desc{font-size:10px;color:var(--text-dim);line-height:1.45}

/* NOTIF BTN */
.notif-btn{position:relative;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;transition:color .2s;line-height:0}
.notif-btn:hover{color:var(--gold)}
.notif-count{position:absolute;top:-4px;right:-4px;background:var(--gold);color:var(--black);font-size:8px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace}

/* REQUEST LOG */
.request-log{margin-top:22px}
.request-log-title{font-size:9px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px}
.request-entry{padding:11px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.request-entry:last-child{border-bottom:none}
.request-entry-header{display:flex;align-items:center;justify-content:space-between}
.request-entry-type{font-size:10px;color:var(--text);letter-spacing:.08em}
.request-entry-time{font-size:8px;color:var(--text-muted)}
.request-entry-desc{font-size:10px;color:var(--text-dim);line-height:1.4}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--card);border:1px solid var(--border-gold);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;padding:13px 18px;z-index:9001;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ASSET CARD */
.asset-card{background:var(--card);border:1px solid var(--border);padding:16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s}
.asset-card:hover{border-color:var(--border-gold)}
.asset-info{flex:1}
.asset-id{font-size:9px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
.asset-name{font-size:12px;color:var(--text);margin-bottom:4px}
.asset-meta{font-size:9px;color:var(--text-muted)}
.asset-actions{display:flex;gap:8px;align-items:center}

/* HIVEMIND LINKS */
.hive-link{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.hive-link:last-child{border-bottom:none}
.hive-from{font-size:9px;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;min-width:100px}
.hive-arrow{color:var(--border);font-size:12px}
.hive-to{font-size:9px;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase;cursor:pointer;transition:color .2s}
.hive-to:hover{color:var(--gold)}
.hive-desc{font-size:9px;color:var(--text-muted);margin-left:auto}

/* DIVISION GRID */
.division-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.division-card{background:var(--card);border:1px solid var(--border);padding:16px;cursor:pointer;transition:border-color .2s,background .2s}
.division-card:hover{border-color:var(--border-gold);background:var(--card-hover)}
.division-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.division-card-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text)}
.division-card-dot{width:7px;height:7px;border-radius:50%}
.dot-active{background:#4aaa70}
.dot-pending{background:#c8a050}
.dot-development{background:var(--text-muted)}
.division-card-nick{font-size:8px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.division-card-note{font-size:9px;color:var(--text-muted);line-height:1.4}

/* STATUS select inside table */
.status-select{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:'DM Mono',monospace;font-size:8px;padding:3px 8px;cursor:pointer;outline:none;letter-spacing:.1em}
.status-select:focus{border-color:var(--gold)}
.status-select option{background:var(--surface)}

/* EMPTY STATE */
.empty-state{text-align:center;padding:40px 0;color:var(--text-muted);font-size:11px;letter-spacing:.1em}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Initializing command center...</div>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <a class="back-btn" href="https://online.lvo-cloud.cloud">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Portal
    </a>
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">LVO</div>
      <div class="sidebar-logo-sub">Legion V. Omni-Operation<br>Holdings LLC</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-bottom">
      <div class="auth-status">
        <span class="auth-dot"></span>
        <span id="sidebar-user-name">Authenticated</span>
      </div>
      <div id="clerk-user-btn"></div>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div class="top-bar">
      <div class="top-bar-left" id="top-bar-label">LVO Command Center</div>
      <div class="top-bar-right">
        <button class="notif-btn" onclick="toggleNotifPanel()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-count" id="notif-count">0</span>
        </button>
        <div id="clerk-topbar-btn"></div>
      </div>
    </div>
    <div id="pages-container"></div>
  </div>
</div>

<!-- NOTIF PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-panel-header">
    <div class="notif-panel-title">All Requests</div>
    <button class="modal-close" onclick="toggleNotifPanel()">✕</button>
  </div>
  <div class="notif-panel-body" id="notif-panel-body">
    <div style="color:var(--text-muted);font-size:11px;padding-top:20px;text-align:center;">No requests yet.</div>

/* ═══════════════════════════════════
   HELPERS
═══════════════════════════════════ */
function badge(status) {
  const map = {'Active':'active','Pending':'pending','Development':'development','Complete':'complete','Completed':'completed','Blocked':'blocked','Alert':'alert','Secured':'secured','Overdue':'overdue','Sold':'sold','In Development':'development','Submitted':'submitted','In Review':'review','Operational':'operational'};
  return `<span class="badge badge-${map[status]||'pending'}">${status}</span>`;
}
function ts() { return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function showToast(msg) {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function openModal(title,bodyHTML,footerHTML='') {
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHTML;
  document.getElementById('modal-footer').innerHTML=footerHTML;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOnOverlay(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }
function toggleNotifPanel() { notifOpen=!notifOpen; document.getElementById('notif-panel').classList.toggle('open',notifOpen); }
function switchTab(el,targetId,groupId) {
  document.getElementById(groupId).querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.closest('.section,.page').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(targetId).classList.add('active');
}

function submitRequest(division, type, desc) {
  if(!type||!desc) return;
  const req = {division,type,desc,time:ts()};
  allRequests.unshift(req);
  document.getElementById('notif-count').textContent=allRequests.length;
  const body = document.getElementById('notif-panel-body');
  if(allRequests.length===1) body.innerHTML='';
  body.innerHTML = allRequests.map(r=>`
    <div class="notif-entry">
      <div class="notif-entry-header"><span class="notif-division">${r.division}</span><span class="notif-time">${r.time}</span></div>
      <div class="notif-type">${r.type}</div>
      <div class="notif-desc">${r.desc}</div>
    </div>`).join('');
  appendToLog(division, req);
}
function appendToLog(divLabel, req) {
  const d = divisions.find(x=>x.label===divLabel||x.id===divLabel);
  if(!d) return;
  const log = document.getElementById('reqlog-'+d.id);
  if(!log) return;
  const empty = log.querySelector('.req-empty');
  if(empty) empty.remove();
  const e = document.createElement('div');
  e.className='request-entry';
  e.innerHTML=`<div class="request-entry-header"><span class="request-entry-type">${req.type}</span><div style="display:flex;gap:8px;align-items:center;">${badge('Submitted')}<span class="request-entry-time">${req.time}</span></div></div><div class="request-entry-desc">${req.desc}</div>`;
  log.prepend(e);
}
function doRequest(divId) {
  const type = document.getElementById('rtype-'+divId)?.value;
  const desc = document.getElementById('rdesc-'+divId)?.value?.trim();
  if(!desc) { document.getElementById('rdesc-'+divId).style.borderBottomColor='var(--red-light)'; return; }
  document.getElementById('rdesc-'+divId).style.borderBottomColor='';
  const d = divisions.find(x=>x.id===divId);
  submitRequest(d?d.label:divId, type, desc);
  document.getElementById('rdesc-'+divId).value='';
  showToast('Request submitted → '+(d?d.label:divId));
}
function reqBar(divId, types) {
  return `<div class="request-bar">
    <select id="rtype-${divId}">${types.map(t=>`<option>${t}</option>`).join('')}</select>
    <input type="text" id="rdesc-${divId}" placeholder="Describe your request...">
    <button class="btn btn-gold btn-sm" onclick="doRequest('${divId}')">Submit</button>
  </div>`;
}
function reqLog(divId) {
  return `<div class="request-log"><div class="request-log-title">Request Log</div>
    <div id="reqlog-${divId}"><div class="req-empty" style="font-size:10px;color:var(--text-muted);padding:10px 0;">No requests yet.</div></div>
  </div>`;
}

═══════════════════════════════════ */
function renderAssets(series, containerId) {
  const c = document.getElementById(containerId);
  if(!c) return;
  const assets = assetStore[series]||[];
  if(assets.length===0){c.innerHTML='<div class="empty-state">No assets registered.</div>';return;}
  c.innerHTML = assets.map(a=>`
    <div class="asset-card" id="asset-card-${series}-${a.id}">
      <div class="asset-info">
        <div class="asset-id">LVOV — Series ${a.id}</div>
        <div class="asset-name">${a.name}</div>
        <div class="asset-meta">${a.type} &nbsp;·&nbsp; ${a.val}</div>
      </div>
      <div class="asset-actions">
        ${badge(a.status)}
        <button class="btn-danger" onclick="removeAsset('${series}','${a.id}','${containerId}')">Remove</button>
      </div>
    </div>`).join('');
}
function removeAsset(series, id, containerId) {
  assetStore[series] = (assetStore[series]||[]).filter(a=>a.id!==id);
  renderAssets(series, containerId);
  showToast(`Asset ${id} removed`);
  refreshOverviewKPIs();
}
function showAddAssetModal(series, containerId, fields) {
  const fHTML = fields.map(f=>`<div class="form-group">
    <label class="form-label">${f.label}</label>
    <input class="form-input" id="nafield-${f.key}" placeholder="${f.placeholder||''}">
  </div>`).join('');
  openModal(`Add ${series}-Series Asset`, fHTML,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
     <button class="btn btn-gold" onclick="confirmAddAsset('${series}','${containerId}')">Add Asset</button>`
  );
  document.getElementById('nafield-name')?.focus();
}
function confirmAddAsset(series, containerId) {
  const name = document.getElementById('nafield-name')?.value?.trim();
  const type = document.getElementById('nafield-type')?.value?.trim()||'—';
  const val  = document.getElementById('nafield-val')?.value?.trim()||'—';
  if(!name) { showToast('Name is required'); return; }
  const num = assetCounters[series]++;
  const id = series+num;
  (assetStore[series]=assetStore[series]||[]).push({id,name,type,status:'Pending',val});
  closeModal();
  renderAssets(series, containerId);
  showToast(`Asset ${id} added`);
  refreshOverviewKPIs();
}
function refreshOverviewKPIs() {
  const total = Object.values(assetStore).reduce((s,arr)=>s+arr.length,0);
  const el = document.getElementById('kpi-total-assets');
  if(el) el.textContent = total;
}

function navigate(id) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  const pageEl = document.getElementById('page-'+id);
  if(navEl) navEl.classList.add('active');
  if(pageEl) pageEl.classList.add('active');
  const d = divisions.find(x=>x.id===id);
  document.getElementById('top-bar-label').textContent = d ? d.label+(d.sub?' — '+d.sub:'') : 'LVO';
  setTimeout(()=>{
    if(id==='vindex'){renderAssets('A','assets-a');renderAssets('B','assets-b');}
    if(id==='operations') renderAssets('GRO','assets-gro');
    if(id==='pedes') renderAssets('FLEET','assets-fleet');
    if(id==='petra') renderAssets('BUILD','assets-build');
    if(id==='alatus') renderAssets('AIR','assets-air');
    if(id==='capital') drawCapitalChart();
    if(id==='overview') refreshOverviewKPIs();
  },50);
}

/* ═══════════════════════════════════
   CAPITAL CHART
═══════════════════════════════════ */
function drawCapitalChart() {
  const canvas = document.getElementById('capital-chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  canvas.width = canvas.offsetWidth * dpr;
  canvas.height = 155 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w=canvas.offsetWidth, h=155;
  const data=[0.4,0.8,1.2,1.5,1.8,2.2,2.4,2.6,2.5,2.8,3.0,3.2];
  const pad={l:42,r:16,t:16,b:28};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const max=3.5;
  const pts=data.map((v,i)=>({x:pad.l+(i/(data.length-1))*cw,y:pad.t+ch-(v/max)*ch}));
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1;
  [0,1,2,3,4].forEach(i=>{const y=pad.t+(i/4)*ch;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();});
  ctx.fillStyle='#5a5650';ctx.font=`9px 'DM Mono'`;
  [3.5,2.6,1.75,0.87,0].forEach((v,i)=>{const y=pad.t+(i/4)*ch;ctx.fillText('$'+v.toFixed(1)+'M',2,y+3);});
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0,'#b8953f20');grad.addColorStop(1,'#b8953f00');
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+ch);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#b8953f';ctx.lineWidth=1.5;pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
  pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fillStyle='#b8953f';ctx.fill();});
  months.forEach((m,i)=>{const x=pad.l+(i/(data.length-1))*cw;ctx.fillStyle='#5a5650';ctx.font=`8px 'DM Mono'`;ctx.textAlign='center';ctx.fillText(m,x,h-4);});
}
