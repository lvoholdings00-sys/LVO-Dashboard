<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVO Holdings — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-raised:#111114; --line:#242327; --line-soft:#1a1a1d;
    --ink:#eae7e0; --ink-dim:#8b8a86; --ink-faint:#5c5b58;
    --brass:#c8a24a; --brass-dim:#8a7238; --red:#b3564a; --green:#7a9a6f; --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  ::selection{background:var(--brass-dim);color:#000;}
  #app{display:flex;min-height:100vh;}

  /* Back-to-menu button (fixed, top-left, survives re-renders) */
  .back-menu{
    position:fixed; top:20px; left:20px; z-index:999;
    display:flex; align-items:center; gap:8px;
    font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-dim); cursor:pointer;
    padding:9px 14px; border:1px solid var(--line);
    background:var(--bg-raised); border-radius:var(--radius);
    transition:color .15s, border-color .15s, background .15s;
  }
  .back-menu:hover{ color:var(--ink); border-color:var(--brass-dim); background:#17171b; }
  .back-menu .arrow{ font-size:13px; line-height:0; }

  .sidebar{width:280px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:36px 32px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand-seal{width:34px;height:34px;border:1px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;color:var(--brass);margin-bottom:14px;flex-shrink:0;}
  .brand h1{font-size:22px;letter-spacing:-.01em;color:var(--ink);}
  .brand .eyebrow{margin-top:4px;}
  .side-divider{height:1px;background:var(--line);margin:28px 0 22px;}
  .division-switch{display:flex;flex-direction:column;gap:4px;margin-bottom:26px;}
  .division-switch .label{margin-bottom:8px;}
  .division-pill{padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink-dim);font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .12s,color .12s,border-color .12s;}
  .division-pill:hover{color:var(--ink);background:var(--bg-raised);}
  .division-pill.active{color:var(--ink);background:var(--bg-raised);border-color:var(--brass-dim);}
  .division-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
  .division-pill.active .dot{background:var(--brass);}
  .division-pill .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-faint);}
  .division-pill.linked .tag{color:var(--green);}
  .side-links{display:flex;flex-direction:column;gap:2px;margin-bottom:26px;}
  .side-link{padding:9px 10px;border-radius:var(--radius);font-size:14.5px;color:var(--ink-dim);display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;}
  .side-link:hover{color:var(--ink);background:var(--bg-raised);}
  .side-link.active{color:var(--ink);background:var(--bg-raised);border-color:var(--line);}
  .sidebar-footer{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);}
  .sidebar-footer .who{font-size:13px;color:var(--ink-dim);margin-bottom:2px;}
  .sidebar-footer .who .name{color:var(--ink);font-weight:500;}
  .role-tag{display:inline-block;margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);border:1px solid var(--brass-dim);padding:3px 7px;}
  .signout{margin-top:14px;font-size:13px;color:var(--ink-dim);cursor:pointer;}
  .signout:hover{color:var(--red);}
  .main{flex:1;padding:56px 64px;min-width:0;}
  .main-narrow{max-width:1180px;}
  .division-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:16px;}
  .division-head .tagline{color:var(--ink-dim);margin-top:6px;font-size:15px;}
  .tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:30px 0 30px;flex-wrap:wrap;}
  .tab{padding:10px 2px 14px;font-size:15px;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--ink);border-bottom-color:var(--brass);}
  .stat-row,.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px;}
  .card{background:var(--bg-raised);border:1px solid var(--line);padding:22px 24px;position:relative;}
  .remove-btn{position:absolute;top:20px;right:22px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;color:var(--ink-faint);cursor:pointer;background:none;border:none;padding:0;}
  .remove-btn:hover{color:var(--red);}
  .form-card .form-title{margin-bottom:18px;}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .form-row>*{flex:1;min-width:140px;}
  .field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
  input[type=text],input[type=email],input[type=url],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 13px;font-size:14px;border-radius:var(--radius);}
  textarea{min-height:96px;resize:vertical;font-family:inherit;}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass-dim);}
  select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8a86'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:32px;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#0a0a0c;border:none;padding:12px 20px;cursor:pointer;transition:background .15s,opacity .15s;}
  .btn:hover{background:var(--brass);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .form-hint{color:var(--ink-faint);font-size:12.5px;margin-top:12px;line-height:1.6;}
  .form-err{color:var(--red);font-size:12.5px;margin-top:12px;line-height:1.6;}
  .list-panel{margin-bottom:22px;}
  .empty-row{color:var(--ink-faint);font-size:14px;padding:6px 0;}
  .row-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line-soft);gap:16px;flex-wrap:wrap;}
  .row-item:last-child{border-bottom:none;}
  .row-item .title{font-weight:500;font-size:15px;}
  .row-item .sub{color:var(--ink-dim);font-size:13px;margin-top:3px;}
  .row-actions{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .role-select{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:var(--radius);}
  .mail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
  .mail-activity-item{padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .mail-activity-item:last-child{border-bottom:none;}
  .mail-activity-item .subj{color:var(--ink-dim);margin-top:2px;}
  .mail-activity-item .ts{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);margin-top:6px;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--brass-dim);color:var(--brass);padding:5px 10px;}
  .badge.gold{border-color:var(--brass-dim);color:var(--brass);}
  .badge.in{border-color:var(--green);color:var(--green);}
  .loading{padding:80px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .fatal{max-width:560px;margin:120px auto;text-align:center;padding:0 24px;}
  .fatal h2{font-size:26px;margin-bottom:14px;}
  .fatal p{color:var(--ink-dim);font-size:14.5px;line-height:1.6;}
  .login-wrap{max-width:420px;margin:100px auto;padding:0 24px;}
  .login-wrap .brand-seal{margin:0 auto 18px;}
  .login-wrap .brand{text-align:center;margin-bottom:34px;}
  .login-wrap .eyebrow{justify-content:center;display:flex;margin-top:6px;}
  .code-input{letter-spacing:.4em;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:20px;}
  @media (max-width:900px){
    #app{flex-direction:column;} .sidebar{width:100%;height:auto;position:relative;} .main{padding:32px 24px;}
    .mail-grid{grid-template-columns:1fr;}
    .back-menu{ top:14px; left:14px; padding:7px 11px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading Command Center…</div></div>

<script>
/* =========================================================
   LVO Holdings — Command Center (Worker/D1 edition)

   This talks directly to your existing lvo-worker (Cloudflare
   Worker + D1) — the same backend dashboard.html uses. There is
   no Supabase here.

   ACCESS MODEL:
   Your Worker's admin model is "one admin account per division"
   (email is unique per division, tier/role live on that one
   account). So this Command Center holds up to three separate
   session tokens — one per division — stored in localStorage,
   and you log into each division you administer individually.
   Once logged in, switching divisions just switches which
   stored token is active; no new login needed until it expires
   (7 days, matching SESSION_TTL_MS on the Worker).

   TABS: only tabs backed by real Worker routes are here —
   Team (=/members), Mailbox (=/mail), Announcements
   (=/announcements), Activity (=/activity). There is no
   Metrics or Records tab because the Worker/D1 schema has no
   such tables — add them server-side first if you want those.

   BACK TO MENU: loginUrl below points at the classified access
   terminal (the MFA login page). The button does a plain
   navigation there — it does not touch this dashboard's own
   session/token, and it does not change anything about the MFA
   flow on that page (the 6-digit code there is untouched).
========================================================= */
window.LVO_CONFIG = {
  worker: "https://lvo-worker.lvoholdings00.workers.dev",
  loginUrl: "https://lvo-cloud.cloud/",
  divisions: [
    { key: "alliance", name: "Alliance", workerDiv: "Alliance" },
    { key: "vindex",   name: "Vindex",   workerDiv: "Vindex" },
    { key: "ops",      name: "Operations", workerDiv: "Ops" }
  ]
};
</script>
<script>
(function(){
  var cfg = window.LVO_CONFIG;
  var appEl = document.getElementById('app');

  /* ---- Back-to-menu button: appended once to <body>, outside
     #app, so it survives every render() call (render() wipes
     appEl.innerHTML but never touches document.body directly). ---- */
  (function addBackButton(){
    var back = document.createElement('div');
    back.className = 'back-menu';
    back.innerHTML = '<span class="arrow">&larr;</span><span>Menu</span>';
    back.title = 'Back to access terminal';
    back.addEventListener('click', function(){
      window.location.href = cfg.loginUrl;
    });
    document.body.appendChild(back);
  })();

  var TIER_LABELS = {1:'Tier I — Principal',2:'Tier II — Associate',3:'Tier III — Partner',4:'Tier IV — Member'};

  var state = {
    activeDiv: cfg.divisions[0].key,
    tab: 'team',
    tokens: {},      // divKey -> session token
    users: {},        // divKey -> {id,firstName,lastName,email,role,tier,...}
    byDiv: {},         // divKey -> {members:[],mail:[],announcements:[],activity:[],loaded:false}
    pendingLogin: null // {divKey, userId, email} while waiting on 2FA code
  };

  /* ---------------- Token storage ---------------- */
  function tokenKey(divKey){ return 'lvo_cc_token_' + divKey; }
  function loadTokens(){
    cfg.divisions.forEach(function(d){
      var t = localStorage.getItem(tokenKey(d.key));
      if(t) state.tokens[d.key] = t;
    });
  }
  function saveToken(divKey, token){
    state.tokens[divKey] = token;
    localStorage.setItem(tokenKey(divKey), token);
  }
  function clearToken(divKey){
    delete state.tokens[divKey];
    delete state.users[divKey];
    localStorage.removeItem(tokenKey(divKey));
  }

  /* ---------------- Worker fetch helper ---------------- */
  async function api(divKey, path, opts){
    opts = opts || {};
    var token = state.tokens[divKey];
    var headers = { 'Content-Type': 'application/json' };
    if(token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch(cfg.worker + path, { method: opts.method || 'GET', headers: headers, body: opts.body });
    var data = null;
    try { data = await res.json(); } catch(_) {}
    if(!res.ok){
      var e = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
      e.status = res.status; e.data = data;
      if(res.status === 401) clearToken(divKey);
      throw e;
    }
    return data;
  }

  /* ---------------- DOM helper ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.indexOf('on')===0) e.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c===null||c===undefined) return;
      if(typeof c==='string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function divCfg(key){ return cfg.divisions.filter(function(d){ return d.key===key; })[0]; }
  function curUser(){ return state.users[state.activeDiv]; }
  function isLinked(divKey){ return !!state.tokens[divKey] && !!state.users[divKey]; }
  function curData(){ return state.byDiv[state.activeDiv] || {}; }

  /* ---------------- Data loading (per division) ---------------- */
  async function loadDivisionData(divKey){
    var entry = { members: [], mail: [], announcements: [], activity: [], loaded: true, error: null };
    try{
      var results = await Promise.all([
        api(divKey, '/members'),
        api(divKey, '/mail'),
        api(divKey, '/announcements'),
        api(divKey, '/activity')
      ]);
      entry.members = results[0] || [];
      entry.mail = results[1] || [];
      entry.announcements = (results[2] || []).filter(function(a){
        return a.division === divCfg(divKey).workerDiv || a.division === 'All';
      });
      entry.activity = results[3] || [];
    }catch(e){
      entry.error = e.message;
    }
    state.byDiv[divKey] = entry;
  }

  async function refresh(){
    await loadDivisionData(state.activeDiv);
    render();
  }

  async function trySessionRestore(divKey){
    if(!state.tokens[divKey]) return;
    try{
      var res = await api(divKey, '/auth/session');
      state.users[divKey] = res.user;
    }catch(e){
      clearToken(divKey);
    }
  }

  async function switchDivision(divKey){
    state.activeDiv = divKey;
    state.tab = 'team';
    if(isLinked(divKey) && !state.byDiv[divKey]){
      appEl.innerHTML = '<div class="loading">Loading ' + divCfg(divKey).name + '…</div>';
      await loadDivisionData(divKey);
    }
    render();
  }

  /* ---------------- Login flow ---------------- */
  async function submitLogin(divKey, identifier, password, errEl){
    errEl.textContent = '';
    try{
      var d = divCfg(divKey);
      var res = await fetch(cfg.worker + '/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ identifier: identifier, password: password, division: d.workerDiv })
      });
      var data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Login failed');
      state.pendingLogin = { divKey: divKey, userId: data.userId, email: data.email };
      render();
    }catch(e){
      errEl.textContent = e.message;
    }
  }

  async function submitCode(divKey, code, errEl){
    errEl.textContent = '';
    try{
      var pending = state.pendingLogin;
      var res = await fetch(cfg.worker + '/auth/verify', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ userId: pending.userId, code: code, purpose: 'login' })
      });
      var data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Incorrect code');
      saveToken(divKey, data.token);
      state.users[divKey] = data.user;
      state.pendingLogin = null;
      if(data.user.role !== 'admin'){
        errEl.textContent = 'Signed in, but this account is not an admin on ' + divCfg(divKey).name + '.';
      }
      await loadDivisionData(divKey);
      render();
    }catch(e){
      errEl.textContent = e.message;
    }
  }

  function signOutDivision(divKey){
    if(state.tokens[divKey]){
      api(divKey, '/auth/logout', {method:'POST'}).catch(function(){});
    }
    clearToken(divKey);
    delete state.byDiv[divKey];
    render();
  }

  /* ---------------- Shell ---------------- */
  function render(){
    appEl.innerHTML = '';
    appEl.appendChild(renderShell());
  }

  function renderShell(){
    var wrap = el('div', {style:'display:flex;width:100%;'});
    wrap.appendChild(renderSidebar());
    wrap.appendChild(renderMain());
    return wrap;
  }

  function renderSidebar(){
    var side = el('div', {class:'sidebar'});
    side.appendChild(el('div', {class:'brand'}, [
      el('div', {class:'brand-seal'}, ['L']),
      el('h1', {}, ['LVO Holdings']),
      el('div', {class:'eyebrow'}, ['Command Center'])
    ]));
    side.appendChild(el('div', {class:'side-divider'}));

    var switcher = el('div', {class:'division-switch'});
    switcher.appendChild(el('div', {class:'eyebrow label'}, ['Divisions']));
    cfg.divisions.forEach(function(d){
      var linked = isLinked(d.key);
      switcher.appendChild(el('div', {
        class:'division-pill' + (state.activeDiv===d.key ? ' active' : '') + (linked ? ' linked' : ''),
        onclick:function(){ switchDivision(d.key); }
      }, [
        el('span', {}, [d.name]),
        el('span', {class:'tag'}, [linked ? 'LINKED' : 'SIGN IN'])
      ]));
    });
    side.appendChild(switcher);
    side.appendChild(el('div', {class:'side-divider'}));

    if(isLinked(state.activeDiv)){
      var tabs = [
        {id:'team', label:'Team'}, {id:'mailbox', label:'Mailbox'},
        {id:'announcements', label:'Announcements'}, {id:'activity', label:'Activity'}
      ];
      var links = el('div', {class:'side-links'});
      tabs.forEach(function(t){
        links.appendChild(el('div', {class:'side-link' + (state.tab===t.id?' active':''), onclick:function(){ state.tab=t.id; render(); }}, [t.label]));
      });
      side.appendChild(links);
    }

    var footer = el('div', {class:'sidebar-footer'});
    var u = curUser();
    if(u){
      footer.appendChild(el('div', {class:'who'}, [el('span', {class:'name'}, [(u.firstName||'') + ' ' + (u.lastName||'')])]));
      footer.appendChild(el('div', {class:'who', style:'font-size:12px;'}, [u.email]));
      footer.appendChild(el('span', {class:'role-tag'}, [u.role === 'admin' ? 'Administrator' : (TIER_LABELS[u.tier]||'Member')]));
      footer.appendChild(el('div', {class:'signout', onclick:function(){ signOutDivision(state.activeDiv); }}, ['Sign out of ' + divCfg(state.activeDiv).name]));
    } else {
      footer.appendChild(el('div', {class:'who'}, ['Not signed in to ' + divCfg(state.activeDiv).name]));
    }
    side.appendChild(footer);
    return side;
  }

  function renderMain(){
    var main = el('div', {class:'main main-narrow'});
    var d = divCfg(state.activeDiv);

    main.appendChild(el('div', {class:'division-head'}, [
      el('div', {}, [
        el('div', {class:'eyebrow'}, [d.name.toUpperCase()]),
        el('h3', {}, [d.name])
      ])
    ]));

    if(!isLinked(state.activeDiv)){
      main.appendChild(renderLogin(state.activeDiv));
      return main;
    }

    var u = curUser();
    if(u.role !== 'admin'){
      main.appendChild(el('div', {class:'card'}, [
        el('div', {class:'eyebrow', style:'margin-bottom:10px;'}, ['Not authorized']),
        el('div', {style:'color:var(--ink-dim);font-size:14px;line-height:1.6;'}, ['This account is signed in but is not an admin on ' + d.name + '. Admin actions require role = admin on the Worker.'])
      ]));
      return main;
    }

    var data = curData();
    if(!data.loaded){
      main.appendChild(el('div', {class:'loading'}, ['Loading ' + d.name + ' data…']));
      loadDivisionData(state.activeDiv).then(render);
      return main;
    }
    if(data.error){
      main.appendChild(el('div', {class:'card'}, [
        el('div', {class:'eyebrow', style:'color:var(--red);margin-bottom:10px;'}, ['Load error']),
        el('div', {style:'color:var(--ink-dim);font-size:14px;'}, [data.error])
      ]));
      return main;
    }

    if(state.tab==='team') main.appendChild(renderTeam());
    if(state.tab==='mailbox') main.appendChild(renderMailbox());
    if(state.tab==='announcements') main.appendChild(renderAnnouncements());
    if(state.tab==='activity') main.appendChild(renderActivity());
    return main;
  }

  /* ---------------- Login form ---------------- */
  function renderLogin(divKey){
    var d = divCfg(divKey);
    var wrap = el('div', {class:'login-wrap'});

    if(state.pendingLogin && state.pendingLogin.divKey === divKey){
      var codeI = el('input', {type:'text', class:'code-input', placeholder:'000000', maxlength:'6'});
      var errEl = el('div', {class:'form-err'});
      wrap.appendChild(el('div', {class:'card form-card'}, [
        el('div', {class:'eyebrow form-title'}, ['Verification code sent to ' + state.pendingLogin.email]),
        el('div', {style:'margin-bottom:18px;'}, [codeI]),
        el('button', {class:'btn', style:'width:100%;', onclick:function(){ submitCode(divKey, codeI.value.trim(), errEl); }}, ['Verify & sign in']),
        errEl,
        el('div', {class:'form-hint'}, ['Check the inbox for the account you just signed in with. Code expires in 10 minutes.'])
      ]));
      return wrap;
    }

    var idI = el('input', {type:'text', placeholder:'Email or username'});
    var pwI = el('input', {type:'password', placeholder:'Password'});
    var errEl2 = el('div', {class:'form-err'});
    wrap.appendChild(el('div', {class:'card form-card'}, [
      el('div', {class:'eyebrow form-title'}, ['Sign in — ' + d.name]),
      el('div', {style:'margin-bottom:14px;'}, [el('label', {class:'field-label'}, ['Identifier']), idI]),
      el('div', {style:'margin-bottom:18px;'}, [el('label', {class:'field-label'}, ['Password']), pwI]),
      el('button', {class:'btn', style:'width:100%;', onclick:function(){ submitLogin(divKey, idI.value.trim(), pwI.value, errEl2); }}, ['Continue']),
      errEl2,
      el('div', {class:'form-hint'}, ['Uses your existing ' + d.name + ' admin account. A 6-digit code will be emailed to confirm sign-in.'])
    ]));
    return wrap;
  }

  /* ---------------- Team (= /members) ---------------- */
  function renderTeam(){
    var wrap = el('div');
    var DK = state.activeDiv;
    var data = curData();
    var panel = el('div', {class:'card list-panel'});
    if(data.members.length===0) panel.appendChild(el('div', {class:'empty-row'}, ['No members yet.']));

    data.members.forEach(function(m){
      var tierSel = el('select', {class:'role-select'}, Object.keys(TIER_LABELS).map(function(k){
        return el('option', {value:k}, [TIER_LABELS[k]]);
      }));
      tierSel.value = String(m.tier || 4);
      var roleSel = el('select', {class:'role-select'}, [
        el('option', {value:'member'}, ['Member']), el('option', {value:'admin'}, ['Admin'])
      ]);
      roleSel.value = m.role === 'admin' ? 'admin' : 'member';

      var saveBtn = el('button', {class:'btn', style:'padding:8px 14px;', onclick:async function(){
        try{
          await api(DK, '/members/' + m.uid, { method:'PUT', body: JSON.stringify({ tier: parseInt(tierSel.value), role: roleSel.value }) });
          await refresh();
        }catch(e){ alert('Failed: ' + e.message); }
      }}, ['Save']);

      panel.appendChild(el('div', {class:'row-item'}, [
        el('div', {}, [el('div', {class:'title'}, [m.name || 'Unknown']), el('div', {class:'sub'}, [m.email || ''])]),
        el('div', {class:'row-actions'}, [
          tierSel, roleSel, saveBtn,
          el('button', {class:'remove-btn', onclick:async function(){
            if(!confirm('Remove ' + (m.name||'this member') + '?')) return;
            try{ await api(DK, '/members/' + m.uid, {method:'DELETE'}); await refresh(); }
            catch(e){ alert('Failed: ' + e.message); }
          }}, ['Remove'])
        ])
      ]));
    });
    wrap.appendChild(panel);

    var firstI=el('input',{type:'text',placeholder:'First name'}), lastI=el('input',{type:'text',placeholder:'Last name'});
    var userI=el('input',{type:'text',placeholder:'username'}), emailI=el('input',{type:'text',placeholder:'name@company.com'});
    var tierNewSel = el('select', {}, Object.keys(TIER_LABELS).map(function(k){ return el('option', {value:k}, [TIER_LABELS[k]]); }));
    tierNewSel.value = '4';
    var roleNewSel = el('select', {}, [el('option', {value:'member'}, ['Member']), el('option', {value:'admin'}, ['Admin'])]);
    var createErr = el('div', {class:'form-err'});
    wrap.appendChild(el('div', {class:'card form-card'}, [
      el('div', {class:'eyebrow form-title'}, ['Create member']),
      el('div', {class:'form-row'}, [firstI, lastI]),
      el('div', {class:'form-row'}, [userI, emailI]),
      el('div', {class:'form-row'}, [tierNewSel, roleNewSel, el('button', {class:'btn', style:'flex:0 0 auto;', onclick:async function(){
        createErr.textContent = '';
        if(!firstI.value.trim() || !lastI.value.trim() || !userI.value.trim() || !emailI.value.trim()){
          createErr.textContent = 'First name, last name, username, and email are all required.';
          return;
        }
        try{
          await api(DK, '/members', { method:'POST', body: JSON.stringify({
            firstName: firstI.value.trim(), lastName: lastI.value.trim(),
            username: userI.value.trim(), email: emailI.value.trim(),
            tier: parseInt(tierNewSel.value), role: roleNewSel.value
          })});
          firstI.value=lastI.value=userI.value=emailI.value='';
          await refresh();
        }catch(e){ createErr.textContent = e.message; }
      }}, ['Create & email credentials'])]),
      createErr,
      el('div', {class:'form-hint'}, ['A temporary password is generated and emailed automatically. The new account is pre-verified — no signup step needed.'])
    ]));
    return wrap;
  }

  /* ---------------- Mailbox (= /mail) ---------------- */
  function renderMailbox(){
    var wrap = el('div', {class:'mail-grid'});
    var DK = state.activeDiv;
    var data = curData();
    var toI=el('input',{type:'text',placeholder:'name@company.com'}), subjI=el('input',{type:'text'}), msgI=el('textarea',{});
    var sendErr = el('div', {class:'form-err'});
    var compose = el('div', {class:'card form-card'}, [
      el('div', {class:'eyebrow form-title'}, ['Compose']),
      el('div', {style:'margin-bottom:16px;'}, [el('label', {class:'field-label'}, ['To']), toI]),
      el('div', {style:'margin-bottom:16px;'}, [el('label', {class:'field-label'}, ['Subject']), subjI]),
      el('div', {style:'margin-bottom:20px;'}, [el('label', {class:'field-label'}, ['Message']), msgI]),
      el('button', {class:'btn', onclick:async function(){
        sendErr.textContent = '';
        if(!toI.value.trim() || !subjI.value.trim() || !msgI.value.trim()){
          sendErr.textContent = 'To, subject, and message are all required.'; return;
        }
        try{
          await api(DK, '/mail', { method:'POST', body: JSON.stringify({ to: toI.value.trim(), subject: subjI.value.trim(), body: msgI.value.trim() }) });
          toI.value=subjI.value=msgI.value='';
          await refresh();
        }catch(e){ sendErr.textContent = e.message; }
      }}, ['Send mail']),
      sendErr
    ]);
    var activity = el('div');
    activity.appendChild(el('div', {class:'eyebrow', style:'margin-bottom:16px;'}, ['Mailbox activity']));
    var panel = el('div', {class:'card'});
    if(data.mail.length===0) panel.appendChild(el('div', {class:'empty-row'}, ['No mail on file yet.']));
    data.mail.forEach(function(mm){
      var dirLabel = mm.direction === 'inbound' ? 'From ' + mm.from_addr : 'To ' + mm.to_addr;
      panel.appendChild(el('div', {class:'mail-activity-item'}, [
        el('div', {}, [el('span', {class:'badge ' + (mm.direction==='inbound'?'in':'gold')}, [mm.direction==='inbound'?'Received':'Sent']), ' ', dirLabel]),
        el('div', {class:'subj'}, [mm.subject]),
        el('div', {class:'ts'}, [new Date(mm.created_at).toLocaleString()])
      ]));
    });
    activity.appendChild(panel);
    wrap.appendChild(compose); wrap.appendChild(activity);
    return wrap;
  }

  /* ---------------- Announcements ---------------- */
  function renderAnnouncements(){
    var wrap = el('div');
    var DK = state.activeDiv;
    var d = divCfg(DK);
    var data = curData();
    var panel = el('div', {class:'card list-panel'});
    if(data.announcements.length===0) panel.appendChild(el('div', {class:'empty-row'}, ['No announcements yet.']));
    data.announcements.forEach(function(a){
      panel.appendChild(el('div', {class:'row-item'}, [
        el('div', {}, [
          el('div', {class:'title'}, [(a.pinned?'\u25C8 ':'') + a.title]),
          el('div', {class:'sub'}, [a.body])
        ]),
        el('div', {class:'row-actions'}, [
          el('button', {class:'btn', style:'padding:8px 14px;', onclick:async function(){
            try{ await api(DK, '/announcements/' + a.id + '/pin', {method:'PUT', body: JSON.stringify({pinned: !a.pinned})}); await refresh(); }
            catch(e){ alert('Failed: ' + e.message); }
          }}, [a.pinned ? 'Unpin' : 'Pin']),
          el('button', {class:'remove-btn', onclick:async function(){
            if(!confirm('Delete this announcement?')) return;
            try{ await api(DK, '/announcements/' + a.id, {method:'DELETE'}); await refresh(); }
            catch(e){ alert('Failed: ' + e.message); }
          }}, ['Delete'])
        ])
      ]));
    });
    wrap.appendChild(panel);

    var titleI=el('input',{type:'text',placeholder:'Title'}), bodyI=el('textarea',{placeholder:'Body'});
    var postErr = el('div', {class:'form-err'});
    wrap.appendChild(el('div', {class:'card form-card'}, [
      el('div', {class:'eyebrow form-title'}, ['Post announcement — ' + d.name]),
      el('div', {style:'margin-bottom:14px;'}, [titleI]),
      el('div', {style:'margin-bottom:18px;'}, [bodyI]),
      el('button', {class:'btn', onclick:async function(){
        postErr.textContent = '';
        if(!titleI.value.trim() || !bodyI.value.trim()){ postErr.textContent = 'Title and body required.'; return; }
        try{
          await api(DK, '/announcements', { method:'POST', body: JSON.stringify({ title: titleI.value.trim(), body: bodyI.value.trim(), division: d.workerDiv }) });
          titleI.value = bodyI.value = '';
          await refresh();
        }catch(e){ postErr.textContent = e.message; }
      }}, ['Post']),
      postErr
    ]));
    return wrap;
  }

  /* ---------------- Activity ---------------- */
  function renderActivity(){
    var wrap = el('div');
    var data = curData();
    var panel = el('div', {class:'card list-panel'});
    if(data.activity.length===0) panel.appendChild(el('div', {class:'empty-row'}, ['No activity yet.']));
    data.activity.forEach(function(a){
      panel.appendChild(el('div', {class:'row-item'}, [
        el('div', {}, [
          el('div', {class:'title'}, [a.action]),
          el('div', {class:'sub'}, [(a.actor||'') + ' · ' + new Date(a.time).toLocaleString()])
        ]),
        a.is_admin_action ? el('span', {class:'badge gold'}, ['Admin']) : null
      ]));
    });
    wrap.appendChild(panel);
    return wrap;
  }

  /* ---------------- Boot ---------------- */
  async function boot(){
    loadTokens();
    var keys = Object.keys(state.tokens);
    if(keys.length){
      await Promise.all(keys.map(trySessionRestore));
    }
    if(isLinked(state.activeDiv)){
      await loadDivisionData(state.activeDiv);
    }
    render();
  }

  boot();
})();
</script>
</body>
</html>
