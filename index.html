<html lang="en">
<head>

<style>
/* ═══════════════════════════════════════════
   ROOT VARIABLES
═══════════════════════════════════════════ */
:root {
  --black:       #0a0a0a;
  --surface:     #111111;
  --card:        #161616;
  --card-hover:  #1c1c1c;
  --border:      #2a2a2a;
  --border-gold: #b8953f44;
  --gold:        #b8953f;
  --gold-light:  #d4a853;
  --gold-dim:    #7a5f1a;
  --gold-glow:   #b8953f18;
  --text:        #e8e6e0;
  --text-dim:    #9a9690;
  --text-muted:  #5a5650;
  --red:         #8b2020;
  --red-light:   #c0392b;
  --green-dim:   #1a3a2a;
  --green:       #2d6a4a;
  --sidebar-w:   224px;
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { font-size: 13px; }

body {
  background: var(--black);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.3;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app { display: none; height: 100vh; overflow: hidden; }
#app.visible { display: flex; animation: fadeIn 0.6s ease; }

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

#loading-screen {
  position: fixed;
  inset: 0;
  background: var(--black);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  gap: 20px;
}

.loading-spinner {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
}

.sidebar-logo {
  padding: 26px 22px 18px;
  border-bottom: 1px solid var(--border);
}

.sidebar-logo-text {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 300;
  letter-spacing: 0.35em;
  color: var(--gold);
  line-height: 1;
  margin-bottom: 5px;
}

.sidebar-logo-sub {
  font-size: 8px;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  text-transform: uppercase;
  line-height: 1.5;
}

.sidebar-nav { flex: 1; padding: 10px 0; }

.nav-section-label {
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  text-transform: uppercase;
  padding: 14px 22px 6px;
  opacity: 0.6;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 22px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  border-left: 2px solid transparent;
  border-right: 2px solid transparent;
}

.nav-item:hover { background: var(--gold-glow); }
.nav-item.active { background: var(--gold-glow); border-left-color: var(--gold); }

.nav-icon {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}
.nav-item.active .nav-icon, .nav-item:hover .nav-icon { color: var(--gold); }

.nav-label { font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.04em; }
.nav-sub   { font-size: 8px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }
.nav-item.active .nav-label, .nav-item:hover .nav-label { color: var(--text); }

.sidebar-bottom {
  padding: 18px 22px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.auth-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.auth-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

/* ═══════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════ */
#main {
  flex: 1;
  height: 100vh;
  overflow-y: auto;
  background: var(--black);
  min-width: 0;
}

.page { display: none; padding: 36px 44px 60px; animation: pageIn 0.25s ease; }
.page.active { display: block; }

@keyframes pageIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* ═══════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════ */
.top-bar {
  position: sticky;
  top: 0;
  background: var(--black);
  border-bottom: 1px solid var(--border);
  padding: 13px 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
}

.top-bar-left { font-size: 9px; letter-spacing: 0.22em; color: var(--text-muted); text-transform: uppercase; }
.top-bar-right { display: flex; align-items: center; gap: 14px; }
.top-bar-user { font-size: 9px; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; }

.notif-btn {
  position: relative;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  transition: color 0.2s;
  line-height: 0;
}
.notif-btn:hover { color: var(--gold); }

.notif-count {
  position: absolute;
  top: -4px; right: -4px;
  background: var(--gold);
  color: var(--black);
  font-size: 8px;
  font-weight: 700;
  width: 15px; height: 15px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
}

/* ═══════════════════════════════════════════
   PAGE HEADER
═══════════════════════════════════════════ */
.page-header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }

.page-title {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 4px;
}

.page-title-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 44px;
  font-weight: 300;
  color: var(--text);
  letter-spacing: 0.02em;
  line-height: 1;
}

.page-title-tag {
  font-size: 9px;
  letter-spacing: 0.35em;
  color: var(--gold);
  text-transform: uppercase;
}

.page-dba {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.page-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.65;
  max-width: 640px;
}

/* ═══════════════════════════════════════════
   KPI GRID
═══════════════════════════════════════════ */
.kpi-grid   { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 24px; }
.kpi-grid-4 { grid-template-columns: repeat(4,1fr); }
.kpi-grid-2 { grid-template-columns: repeat(2,1fr); }

.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 22px;
  transition: border-color 0.2s, background 0.2s;
}
.kpi-card:hover { border-color: var(--border-gold); background: var(--card-hover); }

.kpi-label { font-size: 8px; letter-spacing: 0.3em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
.kpi-value { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 300; color: var(--text); line-height: 1; margin-bottom: 4px; }
.kpi-sub   { font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; }
.kpi-sub.gold { color: var(--gold); }
.kpi-sub.red  { color: var(--red-light); }

/* ═══════════════════════════════════════════
   SECTION
═══════════════════════════════════════════ */
.section {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 22px;
  margin-bottom: 18px;
}

.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

/* ═══════════════════════════════════════════
   TABLE
═══════════════════════════════════════════ */
.data-table { width: 100%; border-collapse: collapse; }

.data-table th {
  font-size: 8px;
  letter-spacing: 0.25em;
  color: var(--text-muted);
  text-transform: uppercase;
  padding: 0 14px 10px 0;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.data-table td {
  padding: 12px 14px 12px 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11.5px;
}

.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { color: var(--text); }
.data-table .gold-link { color: var(--gold); cursor: pointer; }

/* ═══════════════════════════════════════════
   BADGES
═══════════════════════════════════════════ */
.badge {
  display: inline-block;
  padding: 3px 9px;
  font-size: 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border: 1px solid;
  white-space: nowrap;
}

.badge-active      { color: var(--gold);    border-color: var(--gold-dim);  background: #b8953f08; }
.badge-pending     { color: #c8a050;        border-color: #8b6020;          background: #8b60200a; }
.badge-development { color: var(--text-dim); border-color: var(--border);   background: transparent; }
.badge-complete, .badge-completed { color: #6aaa80; border-color: #2d6a4a; background: #2d6a4a0a; }
.badge-blocked, .badge-alert, .badge-overdue { color: #e05555; border-color: var(--red); background: #8b20200a; }
.badge-secured     { color: #6aaa80; border-color: #2d6a4a; background: #2d6a4a0a; }
.badge-submitted   { color: #7090c0; border-color: #304060; background: #3040600a; }
.badge-review      { color: #c0a020; border-color: #806800; background: #8068000a; }
.badge-gold        { color: var(--gold-light); border-color: var(--gold-dim); background: #b8953f0a; }
.badge-silver      { color: #a0a0b0; border-color: #606070; background: transparent; }
.badge-bronze      { color: #c09060; border-color: #7a5030; background: transparent; }
.badge-sold        { color: var(--text-muted); border-color: var(--border); background: transparent; }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 9px 18px;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-gold    { background: var(--gold); color: var(--black); font-weight: 500; }
.btn-gold:hover { background: var(--gold-light); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }
.btn-sm { padding: 5px 11px; font-size: 8px; }
.btn-danger { background: transparent; border: 1px solid var(--red); color: #e05555; }
.btn-danger:hover { background: var(--red); color: var(--text); }
.btn:disabled { opacity:0.45; cursor:not-allowed; pointer-events:none; }

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
.tabs { display: flex; margin-bottom: 18px; border-bottom: 1px solid var(--border); }

.tab {
  padding: 9px 18px;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s;
  margin-bottom: -1px;
}
.tab:hover { color: var(--text-dim); }
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ═══════════════════════════════════════════
   LAYOUT HELPERS
═══════════════════════════════════════════ */
.two-col { display: grid; grid-template-columns: 1fr 360px; gap: 18px; }
.three-col { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }

/* ═══════════════════════════════════════════
   ACTIVITY FEED
═══════════════════════════════════════════ */
.activity-feed { display: flex; flex-direction: column; }

.activity-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-dim); margin-top: 4px; flex-shrink: 0; }
.activity-dot.red   { background: var(--red-light); }
.activity-dot.green { background: var(--green); }
.activity-dot.gold  { background: var(--gold); }
.activity-time { font-size: 9px; color: var(--text-muted); letter-spacing: 0.1em; white-space: nowrap; }
.activity-text { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; }

/* ═══════════════════════════════════════════
   PROGRESS BAR
═══════════════════════════════════════════ */
.progress-wrap  { display: flex; align-items: center; gap: 10px; }
.progress-bar   { flex: 1; height: 2px; background: var(--border); }
.progress-fill  { height: 100%; background: var(--gold); transition: width 0.4s; }
.progress-label { font-size: 10px; color: var(--gold); min-width: 34px; text-align: right; }

/* ═══════════════════════════════════════════
   FORMS
═══════════════════════════════════════════ */
.form-group  { margin-bottom: 16px; }
.form-row    { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-label  { display: block; font-size: 8px; letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 7px; }

.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--card);
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 9px 10px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-bottom-color: var(--gold); }
.form-input::placeholder { color: var(--text-muted); }
.form-select option { background: var(--surface); }
.form-textarea { resize: vertical; min-height: 75px; }

/* ═══════════════════════════════════════════
   STATUS SELECT
═══════════════════════════════════════════ */
.status-select {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  padding: 3px 8px;
  cursor: pointer;
  outline: none;
  letter-spacing: 0.1em;
}
.status-select:focus { border-color: var(--gold); }
.status-select option { background: var(--surface); }

/* ═══════════════════════════════════════════
   REQUEST BAR
═══════════════════════════════════════════ */
.request-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-top: 1px solid var(--border-gold);
  align-items: flex-end;
}

.request-bar select, .request-bar input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 5px 6px;
  outline: none;
  transition: border-color 0.2s;
}
.request-bar input { flex: 1; }
.request-bar input::placeholder { color: var(--text-muted); }
.request-bar input:focus, .request-bar select:focus { border-bottom-color: var(--gold); }
.request-bar select { color: var(--text-dim); min-width: 170px; background: var(--card); }
.request-bar select option { background: var(--surface); }

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: #0a0a0acc;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border-gold);
  width: 520px;
  max-width: 92vw;
  max-height: 88vh;
  overflow-y: auto;
  padding: 30px;
  animation: modalIn 0.22s ease;
}

@keyframes modalIn { from { opacity:0; transform:scale(0.97) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }

.modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }

.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.04em;
}

.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 0; line-height: 1; transition: color 0.2s; }
.modal-close:hover { color: var(--text); }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }

/* ═══════════════════════════════════════════
   NOTIFICATION PANEL
═══════════════════════════════════════════ */
.notif-panel {
  position: fixed;
  top: 0; right: -380px;
  width: 380px;
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 400;
  transition: right 0.3s ease;
  display: flex;
  flex-direction: column;
}
.notif-panel.open { right: 0; }

.notif-panel-header {
  padding: 22px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.notif-panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; letter-spacing: 0.04em; }
.notif-panel-body  { flex: 1; overflow-y: auto; padding: 14px 22px; }

.notif-entry { padding: 13px 0; border-bottom: 1px solid var(--border); }
.notif-entry:last-child { border-bottom: none; }
.notif-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.notif-division { font-size: 8px; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
.notif-time     { font-size: 8px; color: var(--text-muted); }
.notif-type     { font-size: 10px; color: var(--text); letter-spacing: 0.08em; margin-bottom: 3px; }
.notif-desc     { font-size: 10px; color: var(--text-dim); line-height: 1.45; }

/* ═══════════════════════════════════════════
   REQUEST LOG
═══════════════════════════════════════════ */
.request-log { margin-top: 22px; }
.request-log-title { font-size: 9px; letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }

.request-entry { padding: 11px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.request-entry:last-child { border-bottom: none; }
.request-entry-header { display: flex; align-items: center; justify-content: space-between; }
.request-entry-type   { font-size: 10px; color: var(--text); letter-spacing: 0.08em; }
.request-entry-time   { font-size: 8px; color: var(--text-muted); }
.request-entry-desc   { font-size: 10px; color: var(--text-dim); line-height: 1.4; }

/* ═══════════════════════════════════════════
   TAGS
═══════════════════════════════════════════ */
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tag { padding: 4px 13px; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid var(--gold-dim); color: var(--gold); background: var(--gold-glow); }

/* ═══════════════════════════════════════════
   DIVISION HEALTH GRID
═══════════════════════════════════════════ */
.division-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; margin-bottom: 24px; }

.division-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.division-card:hover { border-color: var(--border-gold); background: var(--card-hover); }

.division-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.division-card-name   { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--text); }
.division-card-dot    { width: 7px; height: 7px; border-radius: 50%; }
.dot-active      { background: #4aaa70; }
.dot-pending     { background: #c8a050; }
.dot-development { background: var(--text-muted); }
.division-card-nick   { font-size: 8px; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; }
.division-card-note   { font-size: 9px; color: var(--text-muted); line-height: 1.4; }

/* ═══════════════════════════════════════════
   INTEGRATION CARDS
═══════════════════════════════════════════ */
.integration-row { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.integration-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 13px 16px;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  min-width: 180px;
}
.integration-card strong { color: var(--gold); display: block; margin-bottom: 3px; font-size: 9px; letter-spacing: 0.15em; font-weight: 400; }

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--card);
  border: 1px solid var(--border-gold);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 13px 18px;
  z-index: 9001;
  animation: toastIn 0.3s ease;
}

@keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ═══════════════════════════════════════════
   CLERK OVERRIDES
═══════════════════════════════════════════ */
.cl-rootBox                      { font-family: 'DM Mono', monospace !important; }
.cl-userButtonPopoverCard        { background: var(--surface) !important; border: 1px solid var(--border-gold) !important; border-radius: 0 !important; }
.cl-userButtonPopoverActionButton{ border-radius: 0 !important; color: var(--text-dim) !important; }
.cl-userButtonPopoverActionButton:hover { background: var(--gold-glow) !important; color: var(--gold) !important; }
.cl-userButtonPopoverActionButtonText { font-family: 'DM Mono', monospace !important; font-size: 11px !important; }
.cl-userButtonBox                { border-radius: 0 !important; }
.cl-avatarBox                    { border-radius: 0 !important; border: 1px solid var(--border-gold) !important; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════
   CLERK CONFIG & AUTH CHECK
═══════════════════════════════════════════ */
const CLERK_ALLOWED_DOMAINS = ['lvo-cloud.cloud','dash.lvo-cloud.cloud','login.lvo-cloud.cloud','online.lvo-cloud.cloud'];
const LOGIN_URL = 'https://login.lvo-cloud.cloud';

window.addEventListener('load', async () => {
  try {
    await Clerk.load({ 
      allowedRedirectOrigins: CLERK_ALLOWED_DOMAINS.map(d=>`https://${d}`) 
    });
  } catch(e) {
    console.error('Clerk load error:', e);
    window.location.href = LOGIN_URL;
    return;
  }

  // If not authenticated, redirect to login
  if (!Clerk.user) {
    window.location.href = LOGIN_URL;
    return;
  }

  // User is authenticated - initialize app
  const app = document.getElementById('app');
  const loadingScreen = document.getElementById('loading-screen');
  const sidebarName = document.getElementById('sidebar-user-name');

  // Mount user button
  Clerk.mountUserButton(document.getElementById('clerk-topbar-btn'));
  Clerk.mountUserButton(document.getElementById('clerk-user-btn'));

  // Set user display name
  const displayName = Clerk.user.firstName
    ? Clerk.user.firstName + (Clerk.user.lastName ? ' ' + Clerk.user.lastName[0] + '.' : '')
    : (Clerk.user.primaryEmailAddress?.emailAddress || 'Authenticated');
  sidebarName.textContent = displayName;

  // Hide loading, show app
  loadingScreen.style.display = 'none';
  app.classList.add('visible');

  // Initialize app
  initApp();

  // Listen for sign-out
  Clerk.addListener(({ user }) => {
    if (!user) {
      window.location.href = LOGIN_URL;
    }
  });
});

/* ═══════════════════════════════════════════
   GLOBAL STATE
═══════════════════════════════════════════ */
let allRequests = [];
let notifOpen   = false;

/* ═══════════════════════════════════════════
   NAVIGATION STRUCTURE
═══════════════════════════════════════════ */
const divisions = [
  { id:'overview',    label:'Overview',              sub:'',              icon:'grid',      section:'command' },
  { id:'vindex',      label:'Vindex',                sub:'The Gasoline',  icon:'database',  section:'divisions' },
  { id:'operations',  label:'Operations',            sub:'The Engine',    icon:'settings',  section:'divisions' },
  { id:'alliance',    label:'Alliance',              sub:'The Brain',     icon:'users',     section:'divisions' },
  { id:'obscura',     label:'Obscura',               sub:'The Base',      icon:'monitor',   section:'divisions' },
  { id:'capital',     label:'Capital',               sub:'The Reservoir', icon:'briefcase', section:'divisions' },
  { id:'custodia',    label:'Custodia',              sub:'The Guard',     icon:'shield',    section:'divisions' },
  { id:'outreach',    label:'Outreach',              sub:'The Heart',     icon:'heart',     section:'divisions' },
  { id:'alatus',      label:'Alatus',                sub:'The Wing',      icon:'wind',      section:'divisions' },
  { id:'pedes',       label:'Pedes',                 sub:'The Legs',      icon:'truck',     section:'divisions' },
  { id:'petra',       label:'Petra',                 sub:'The Bedrock',   icon:'triangle',  section:'divisions' },
];

const ICONS = {
  grid:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
  database:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
  settings:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  users:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  monitor:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>`,
  briefcase: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
  shield:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  heart:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
  wind:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>`,
  truck:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`,
  triangle:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`,
};

/* ═══════════════════════════════════════════
   HELPERS & UTILITIES
═══════════════════════════════════════════ */
function badge(status) {
  const map = {
    'Active':'active','Pending':'pending','Development':'development',
    'Complete':'complete','Completed':'completed','Blocked':'blocked',
    'Alert':'alert','Secured':'secured','Overdue':'overdue','Sold':'sold',
    'In Development':'development','Submitted':'submitted','In Review':'review'
  };
  return `<span class="badge badge-${map[status]||'pending'}">${status}</span>`;
}

function tierBadge(t) { return `<span class="badge badge-${t.toLowerCase()}">${t}</span>`; }

function updateRowStatus(sel, idx) {
  sel.closest('tr').querySelectorAll('td')[idx].innerHTML = badge(sel.value);
}

function switchTab(el, targetId, groupId) {
  document.getElementById(groupId).querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.closest('.section,.page').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(targetId).classList.add('active');
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

function openModal(title, bodyHTML, footerHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function closeModalOnOverlay(e) { if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function toggleNotifPanel() {
  notifOpen = !notifOpen;
  document.getElementById('notif-panel').classList.toggle('open', notifOpen);
}

function submitRequest(division, type, desc) {
  if (!type||!desc) return;
  const ts = new Date();
  const req = { division, type, desc, time: ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) };
  allRequests.unshift(req);
  document.getElementById('notif-count').textContent = allRequests.length;
  const body = document.getElementById('notif-panel-body');
  if (allRequests.length===1) body.innerHTML='';
  body.innerHTML = allRequests.map(r=>`
    <div class="notif-entry">
      <div class="notif-entry-header"><span class="notif-division">${r.division}</span><span class="notif-time">${r.time}</span></div>
      <div class="notif-type">${r.type}</div>
      <div class="notif-desc">${r.desc}</div>
    </div>`).join('');
  appendToLog(division, req);
}

function appendToLog(divLabel, req) {
  const d = divisions.find(x=>x.label===divLabel||x.id===divLabel);
  if (!d) return;
  const log = document.getElementById('reqlog-'+d.id);
  if (!log) return;
  const empty = log.querySelector('.req-empty');
  if (empty) empty.remove();
  const e = document.createElement('div');
  e.className = 'request-entry';
  e.innerHTML = `<div class="request-entry-header"><span class="request-entry-type">${req.type}</span><div style="display:flex;gap:8px;align-items:center;">${badge('Submitted')}<span class="request-entry-time">${req.time}</span></div></div><div class="request-entry-desc">${req.desc}</div>`;
  log.appendChild(e);
}

function doRequest(divId) {
  const type = document.getElementById('rtype-'+divId)?.value;
  const desc = document.getElementById('rdesc-'+divId)?.value?.trim();
  if (!desc) { document.getElementById('rdesc-'+divId).style.borderBottomColor='var(--red-light)'; return; }
  document.getElementById('rdesc-'+divId).style.borderBottomColor='';
  const d = divisions.find(x=>x.id===divId);
  submitRequest(d?d.label:divId, type, desc);
  document.getElementById('rdesc-'+divId).value='';
  showToast('Request submitted to '+(d?d.label:divId));
}

function reqBar(divId, types) {
  return `<div class="request-bar">
    <select id="rtype-${divId}">${types.map(t=>`<option>${t}</option>`).join('')}</select>
    <input type="text" id="rdesc-${divId}" placeholder="Describe your request...">
    <button class="btn btn-gold btn-sm" onclick="doRequest('${divId}')">Submit</button>
  </div>`;
}

function reqLog(divId) {
  return `<div class="request-log"><div class="request-log-title">Submitted Requests</div>
    <div id="reqlog-${divId}"><div class="req-empty" style="font-size:10px;color:var(--text-muted);padding:10px 0;">No requests yet.</div></div>
  </div>`;
}

/* ═══════════════════════════════════════════
   APP INITIALIZATION
═══════════════════════════════════════════ */
function initApp() {
  buildSidebar();
  document.getElementById('pages-container').innerHTML = [
    buildOverview(), buildVindex(), buildOperations(), buildAlliance(),
    buildObscura(), buildCapital(), buildCustodia(), buildOutreach(),
    buildAlatus(), buildPedes(), buildPetra()
  ].join('');
  navigate('overview');
}

function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let html = '<div class="nav-section-label">Command</div>';
  html += divisions.filter(d=>d.section==='command').map(d=>`
    <div class="nav-item" id="nav-${d.id}" onclick="navigate('${d.id}')">
      <div class="nav-icon">${ICONS[d.icon]}</div>
      <div><div class="nav-label">${d.label}</div>${d.sub?`<div class="nav-sub">${d.sub}</div>`:''}</div>
    </div>`).join('');
  html += '<div class="nav-section-label">Divisions</div>';
  html += divisions.filter(d=>d.section==='divisions').map(d=>`
    <div class="nav-item" id="nav-${d.id}" onclick="navigate('${d.id}')">
      <div class="nav-icon">${ICONS[d.icon]}</div>
      <div><div class="nav-label">${d.label}</div>${d.sub?`<div class="nav-sub">${d.sub}</div>`:''}</div>
    </div>`).join('');
  nav.innerHTML = html;
}

function navigate(id) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const navEl  = document.getElementById('nav-'+id);
  const pageEl = document.getElementById('page-'+id);
  if (navEl)  navEl.classList.add('active');
  if (pageEl) pageEl.classList.add('active');
  const d = divisions.find(x=>x.id===id);
  document.getElementById('top-bar-label').textContent = d ? d.label+(d.sub?' — '+d.sub:'') : 'LVO';
  if (id==='capital') setTimeout(drawCapitalChart,180);
}

/* ══════════════════════════════════════════════════════════
   ██████  DIVISION PAGE BUILDERS
══════════════════════════════════════════════════════════ */

/* [OVERVIEW, VINDEX, OPERATIONS, ALLIANCE, OBSCURA, CAPITAL, CUSTODIA, OUTREACH, ALATUS, PEDES, PETRA pages go here] */

function drawCapitalChart() {
  const canvas = document.getElementById('capital-chart');
  if (!canvas) return;
  const dpr = window.devicePixelRatio||1;
  canvas.width  = canvas.offsetWidth * dpr;
  canvas.height = 155 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = canvas.offsetWidth, h = 155;
  const data   = [0.4,0.8,1.2,1.5,1.8,2.2,2.4,2.6,2.5,2.8,3.0,3.2];
  const pad = {l:42,r:16,t:16,b:28};
  const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const max=3.5;
  const pts = data.map((v,i)=>({ x:pad.l+(i/(data.length-1))*cw, y:pad.t+ch-(v/max)*ch }));
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1;
  [0,1,2,3,4].forEach(i=>{ const y = pad.t+(i/4)*ch; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke(); });
  const grad = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0,'#b8953f20'); grad.addColorStop(1,'#b8953f00');
  ctx.beginPath(); ctx.moveTo(pts[0].x,pad.t+ch); pts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.lineTo(pts[pts.length-1].x,pad.t+ch); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); ctx.strokeStyle='#b8953f'; ctx.lineWidth=1.5; pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fillStyle='#b8953f'; ctx.fill(); });
}
