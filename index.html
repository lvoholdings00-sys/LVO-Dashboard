<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- FIX #10: Content Security Policy -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://clerk.lvo-cloud.cloud https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://lvo-command-worker.lvoholdings00.workers.dev https://clerk.lvo-cloud.cloud https://*.clerk.accounts.dev; img-src 'self' data: https:; worker-src blob:;">
<title>LVO Command Center</title>

<script
  async crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubHZvLWNsb3VkLmNsb3VkJA"
  src="https://clerk.lvo-cloud.cloud/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
></script>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --black:       #0a0a0a;
  --surface:     #111111;
  --card:        #161616;
  --card-hover:  #1c1c1c;
  --border:      #2a2a2a;
  --border-gold: #b8953f44;
  --gold:        #b8953f;
  --gold-light:  #d4a853;
  --gold-dim:    #7a5f1a;
  --gold-glow:   #b8953f18;
  --text:        #e8e6e0;
  --text-dim:    #9a9690;
  --text-muted:  #5a5650;
  --red:         #8b2020;
  --red-light:   #c0392b;
  --green:       #2d6a4a;
  --sidebar-w:   224px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:13px}
body{background:var(--black);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.3}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

#auth-guard{position:fixed;inset:0;background:var(--black);display:flex;align-items:center;justify-content:center;z-index:9000}
#auth-guard-text{font-size:9px;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase}

#app{display:none;height:100vh;overflow:hidden}
#app.visible{display:flex;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto;overflow-x:hidden;flex-shrink:0}
.sidebar-logo{padding:26px 22px 18px;border-bottom:1px solid var(--border)}
.sidebar-logo-text{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;letter-spacing:.35em;color:var(--gold);line-height:1;margin-bottom:5px}
.sidebar-logo-sub{font-size:8px;letter-spacing:.12em;color:var(--text-muted);text-transform:uppercase;line-height:1.5}
.sidebar-nav{flex:1;padding:10px 0}
.nav-section-label{font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;padding:14px 22px 6px;opacity:.6}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 22px;cursor:pointer;transition:background .15s,color .15s;border-left:2px solid transparent}
.nav-item:hover{background:var(--gold-glow)}
.nav-item.active{background:var(--gold-glow);border-left-color:var(--gold)}
.nav-icon{width:15px;height:15px;color:var(--text-muted);flex-shrink:0}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{color:var(--gold)}
.nav-label{font-size:11.5px;color:var(--text-dim);letter-spacing:.04em}
.nav-sub{font-size:8px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.nav-item.active .nav-label,.nav-item:hover .nav-label{color:var(--text)}
.sidebar-bottom{padding:18px 22px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.auth-status{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase}
.auth-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

/* FIX #11: semantic main landmark */
#main{flex:1;height:100vh;overflow-y:auto;background:var(--black);min-width:0}
.page{display:none;padding:36px 44px 60px;animation:pageIn .25s ease}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.top-bar{position:sticky;top:0;background:var(--black);border-bottom:1px solid var(--border);padding:13px 44px;display:flex;align-items:center;justify-content:space-between;z-index:100}
.top-bar-left{font-size:9px;letter-spacing:.22em;color:var(--text-muted);text-transform:uppercase}
.top-bar-right{display:flex;align-items:center;gap:14px}
.notif-btn{position:relative;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;transition:color .2s;line-height:0}
.notif-btn:hover{color:var(--gold)}
.notif-count{position:absolute;top:-4px;right:-4px;background:var(--gold);color:var(--black);font-size:8px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace}

.page-header{margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:20px}
.page-title{display:flex;align-items:baseline;gap:14px;margin-bottom:4px}
.page-title-main{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--text);letter-spacing:.02em;line-height:1}
.page-title-tag{font-size:9px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
.page-dba{font-size:9px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px}
.page-desc{font-size:12px;color:var(--text-muted);line-height:1.65;max-width:640px}

.editable{cursor:text;border-bottom:1px dashed transparent;transition:border-color .2s,background .15s;padding:1px 3px;border-radius:2px;outline:none}
.editable:hover{border-bottom-color:var(--gold-dim)}
.editable:focus{border-bottom-color:var(--gold);background:var(--gold-glow)}
.editable[contenteditable="true"]:empty:before{content:attr(data-placeholder);color:var(--text-muted);font-style:italic}
.edit-mode-active .editable{border-bottom-color:var(--gold-dim)!important}
.edit-hint{font-size:8px;letter-spacing:.18em;color:var(--gold-dim);text-transform:uppercase;padding:4px 10px;border:1px dashed var(--gold-dim);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all .2s;background:transparent;font-family:'DM Mono',monospace}
.edit-hint:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}
.edit-hint.active{border-color:var(--gold);color:var(--gold);background:var(--gold-glow)}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.kpi-grid-4{grid-template-columns:repeat(4,1fr)}
.kpi-grid-2{grid-template-columns:repeat(2,1fr)}
.kpi-card{background:var(--card);border:1px solid var(--border);padding:22px;transition:border-color .2s,background .2s}
.kpi-card:hover{border-color:var(--border-gold);background:var(--card-hover)}
.kpi-label{font-size:8px;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px}
.kpi-value{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:var(--text);line-height:1;margin-bottom:4px}
.kpi-sub{font-size:9px;color:var(--text-muted);letter-spacing:.1em}
.kpi-sub.gold{color:var(--gold)}
.kpi-sub.red{color:var(--red-light)}

.section{background:var(--card);border:1px solid var(--border);padding:22px;margin-bottom:18px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);margin-bottom:18px;letter-spacing:.04em}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}

.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;padding:0 14px 10px 0;text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 14px 10px 0;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:11.5px;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{color:var(--text)}

.badge{display:inline-block;padding:3px 9px;font-size:8px;letter-spacing:.18em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.badge-active{color:var(--gold);border-color:var(--gold-dim);background:#b8953f08}
.badge-pending{color:#c8a050;border-color:#8b6020;background:#8b60200a}
.badge-development{color:var(--text-dim);border-color:var(--border);background:transparent}
.badge-complete,.badge-completed{color:#6aaa80;border-color:#2d6a4a;background:#2d6a4a0a}
.badge-blocked,.badge-alert,.badge-overdue{color:#e05555;border-color:var(--red);background:#8b20200a}
.badge-secured{color:#6aaa80;border-color:#2d6a4a;background:#2d6a4a0a}
.badge-submitted{color:#7090c0;border-color:#304060;background:#3040600a}
.badge-review{color:#c0a020;border-color:#806800;background:#8068000a}
.badge-gold{color:var(--gold-light);border-color:var(--gold-dim);background:#b8953f0a}
.badge-silver{color:#a0a0b0;border-color:#606070;background:transparent}
.badge-bronze{color:#c09060;border-color:#7a5030;background:transparent}
.badge-sold{color:var(--text-muted);border-color:var(--border);background:transparent}
.badge-open{color:#e05555;border-color:var(--red);background:#8b20200a}

.btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.22em;text-transform:uppercase;padding:9px 18px;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--black);font-weight:500}
.btn-gold:hover{background:var(--gold-light)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-muted)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm{padding:5px 11px;font-size:8px}
.btn-danger{background:transparent;border:1px solid var(--red);color:#e05555}
.btn-danger:hover{background:var(--red);color:var(--text)}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:4px 7px;font-size:11px;cursor:pointer;transition:all .2s;font-family:'DM Mono',monospace}
.btn-icon:hover{border-color:var(--red-light);color:var(--red-light)}

.tabs{display:flex;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab{padding:9px 18px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s;margin-bottom:-1px}
.tab:hover{color:var(--text-dim)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}
.tab-content.active{display:block}

.two-col{display:grid;grid-template-columns:1fr 360px;gap:18px}

.activity-feed{display:flex;flex-direction:column}
.activity-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:6px;height:6px;border-radius:50%;background:var(--gold-dim);margin-top:4px;flex-shrink:0}
.activity-time{font-size:9px;color:var(--text-muted);letter-spacing:.1em;white-space:nowrap}
.activity-text{font-size:11.5px;color:var(--text-dim);line-height:1.5}

.progress-wrap{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:2px;background:var(--border)}
.progress-fill{height:100%;background:var(--gold);transition:width .4s}
.progress-label{font-size:10px;color:var(--gold);min-width:34px;text-align:right}

.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-label{display:block;font-size:8px;letter-spacing:.25em;color:var(--text-muted);text-transform:uppercase;margin-bottom:7px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:9px 10px;outline:none;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-bottom-color:var(--gold)}
.form-input::placeholder{color:var(--text-muted)}
.form-select option{background:var(--surface)}
.form-textarea{resize:vertical;min-height:75px}

.request-bar{display:flex;gap:10px;margin-bottom:24px;padding:14px 18px;background:var(--card);border:1px solid var(--border);border-top:1px solid var(--border-gold);align-items:flex-end}
.request-bar select,.request-bar input{background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:5px 6px;outline:none;transition:border-color .2s}
.request-bar input{flex:1}
.request-bar input::placeholder{color:var(--text-muted)}
.request-bar input:focus,.request-bar select:focus{border-bottom-color:var(--gold)}
.request-bar select{color:var(--text-dim);min-width:170px;background:var(--card)}
.request-bar select option{background:var(--surface)}

.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tag{padding:4px 13px;font-size:8px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold-dim);color:var(--gold);background:var(--gold-glow)}

.division-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.division-card{background:var(--card);border:1px solid var(--border);padding:16px;cursor:pointer;transition:border-color .2s,background .2s}
.division-card:hover{border-color:var(--border-gold);background:var(--card-hover)}
.division-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.division-card-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text)}
.division-card-dot{width:7px;height:7px;border-radius:50%}
.dot-active{background:#4aaa70}
.dot-pending{background:#c8a050}
.dot-development{background:var(--text-muted)}
.division-card-nick{font-size:8px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.division-card-note{font-size:9px;color:var(--text-muted);line-height:1.4}

.toast{position:fixed;bottom:28px;right:28px;background:var(--card);border:1px solid var(--border-gold);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;padding:13px 18px;z-index:9001;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.spinner{display:inline-block;width:14px;height:14px;border:1px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{padding:20px;text-align:center;color:var(--text-muted);font-size:10px;letter-spacing:.2em}

.modal-overlay{position:fixed;inset:0;background:#0a0a0acc;z-index:500;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
/* FIX #14: removed backdrop-filter blur for performance; use solid overlay instead */
.modal{background:var(--surface);border:1px solid var(--border-gold);width:520px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:30px;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--text);letter-spacing:.04em}
.modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:0;line-height:1;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.notif-panel{position:fixed;top:0;right:-380px;width:380px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:400;transition:right .3s ease;display:flex;flex-direction:column}
.notif-panel.open{right:0}
.notif-panel-header{padding:22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-panel-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:.04em}
.notif-panel-body{flex:1;overflow-y:auto;padding:14px 22px}
.notif-entry{padding:13px 0;border-bottom:1px solid var(--border)}
.notif-entry:last-child{border-bottom:none}
.notif-entry-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.notif-division{font-size:8px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.notif-time{font-size:8px;color:var(--text-muted)}
.notif-type{font-size:10px;color:var(--text);letter-spacing:.08em;margin-bottom:3px}
.notif-desc{font-size:10px;color:var(--text-dim);line-height:1.45}

.admin-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border)}
.admin-tab{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--text-muted);padding:9px 16px;cursor:pointer;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s;background:none;border-left:none;border-right:none;border-top:none}
.admin-tab:hover{color:var(--text-dim)}
.admin-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.admin-section{display:none}
.admin-section.active{display:block;animation:pageIn .2s ease}

.add-row-btn{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:9px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;cursor:pointer;border-top:1px dashed var(--border);transition:color .2s;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;font-family:'DM Mono',monospace;margin-top:4px}
.add-row-btn:hover{color:var(--gold)}
.add-row-btn::before{content:'＋';font-size:12px}

.status-select{background:transparent;border:1px solid var(--border);color:var(--text-muted);font-family:'DM Mono',monospace;font-size:8px;padding:3px 8px;cursor:pointer;outline:none;letter-spacing:.1em}
.status-select option{background:var(--surface)}

.save-indicator{font-size:8px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;opacity:0;transition:opacity .3s}
.save-indicator.show{opacity:1}

.cl-avatarBox{border-radius:0!important;border:1px solid var(--border-gold)!important}
.cl-userButtonPopoverCard{background:var(--surface)!important;border:1px solid var(--border-gold)!important;border-radius:0!important}
.cl-userButtonPopoverActionButton{border-radius:0!important;color:var(--text-dim)!important}
.cl-userButtonPopoverActionButton:hover{background:var(--gold-glow)!important;color:var(--gold)!important}
.cl-userButtonPopoverActionButtonText{font-family:'DM Mono',monospace!important;font-size:11px!important}
</style>
</head>
<body>

<div id="auth-guard" role="status" aria-live="polite">
  <div id="auth-guard-text">Verifying access…</div>
</div>

<div id="app">
  <nav id="sidebar" aria-label="Division navigation">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">LVO</div>
      <div class="sidebar-logo-sub">Legion V. Omni-Operation<br>Holdings LLC</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-bottom">
      <div class="auth-status">
        <span class="auth-dot" aria-hidden="true"></span>
        <span id="sidebar-user-name">Authenticated</span>
      </div>
      <div id="clerk-user-btn"></div>
    </div>
  </nav>

  <!-- FIX #11: Use semantic <main> instead of <div id="main"> -->
  <main id="main">
    <div class="top-bar">
      <div class="top-bar-left" id="top-bar-label">LVO Command Center</div>
      <div class="top-bar-right">
        <span class="save-indicator" id="save-indicator" aria-live="polite">Saved</span>
        <button class="notif-btn" id="notif-toggle-btn" aria-label="Open requests panel" aria-expanded="false" aria-controls="notif-panel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-count" id="notif-count" aria-label="0 requests">0</span>
        </button>
        <div id="clerk-topbar-btn"></div>
      </div>
    </div>
    <div id="pages-container"></div>
  </main>
</div>

<!-- FIX #11: aria attributes for notification panel -->
<div class="notif-panel" id="notif-panel" role="complementary" aria-label="Submitted requests" aria-hidden="true">
  <div class="notif-panel-header">
    <div class="notif-panel-title">Requests</div>
    <button class="modal-close" aria-label="Close requests panel" id="notif-close-btn">✕</button>

/* ═══════════════════════════════════════════════════
   API HELPERS
   FIX #2: Removed X-Clerk-Role header — admin must be enforced server-side
═══════════════════════════════════════════════════ */
async function api(path, opts = {}) {
  const token = await window.Clerk?.session?.getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  // NOTE: Admin role MUST be verified server-side from the JWT; do NOT send client role headers.
  const res = await fetch(WORKER_URL + path, { ...opts, headers });
  if (!res.ok) {
    const e = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(e.error || res.statusText);
  }
  return res.json();
}
function apiGet(path)         { return api(path); }
function apiPost(path, body)  { return api(path, { method: 'POST', body: JSON.stringify(body) }); }
function apiPut(path, body)   { return api(path, { method: 'PUT',  body: JSON.stringify(body) }); }
function apiDel(path)         { return api(path, { method: 'DELETE' }); }

const STATUS_OPTIONS = ['Active','Pending','Development','Complete','Completed','Blocked','Alert','Secured','Overdue','Sold','Submitted','In Review','Open','Closed','In Development'];

function badge(status) {
  const map = {
    'Active':'active','Pending':'pending','Development':'development',
    'Complete':'complete','Completed':'completed','Blocked':'blocked',
    'Alert':'alert','Secured':'secured','Overdue':'overdue','Sold':'sold',
    'In Development':'development','Submitted':'submitted','In Review':'review',
    'Open':'open','Closed':'complete',
  };
  const key = map[status] || 'pending';
  // FIX #1: esc() applied to status string
  return `<span class="badge badge-${esc(key)}">${esc(status)}</span>`;
}

function tierBadge(t) {
  const tier = t || 'Bronze';

function showToast(msg) {
  const t = document.createElement('div');

}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('open');

  if (_lastModalTrigger) { _lastModalTrigger.focus(); _lastModalTrigger = null; }
}

// FIX #5: submitRequest surfaces errors instead of silently swallowing them
async function submitRequest(division, type, desc) {
  try {
    await apiPost('/requests', { division, type, description: desc });
  } catch(e) {
    showToast('Failed to submit request: ' + e.message);
    return false;
  }
  const req = {
    division,
    type,
    desc,
    time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
  };
  _requests.unshift(req);
  const countEl = document.getElementById('notif-count');
  countEl.textContent = _requests.length;
  countEl.setAttribute('aria-label', _requests.length + ' requests');
  const body = document.getElementById('notif-panel-body');
  if (_requests.length === 1) body.innerHTML = '';
  // FIX #1: esc() all dynamic data in notification panel
  body.innerHTML = _requests.map(r => `
    <div class="notif-entry">
      <div class="notif-entry-header">
        <span class="notif-division">${esc(r.division)}</span>
        <span class="notif-time">${esc(r.time)}</span>
      </div>
      <div class="notif-type">${esc(r.type)}</div>
      <div class="notif-desc">${esc(r.desc)}</div>
    </div>`).join('');
  return true;
}

function doRequest(divId, divLabel) {
  const typeEl = document.getElementById('rtype-' + divId);
  const descEl = document.getElementById('rdesc-' + divId);
  const type = typeEl?.value;
  const desc = descEl?.value?.trim();
  if (!desc) {
    descEl.style.borderBottomColor = 'var(--red-light)';
    descEl.focus();
    return;
  }
  descEl.style.borderBottomColor = '';
  submitRequest(divLabel, type, desc).then(ok => {
    if (ok) {
      descEl.value = '';
      showToast('Request submitted — ' + esc(divLabel));
    }
  });
}

function reqBar(divId, divLabel, types) {
  // FIX #1: esc applied to all interpolated values
  return `<div class="request-bar">
    <select id="rtype-${esc(divId)}" aria-label="Request type">${types.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <input type="text" id="rdesc-${esc(divId)}" placeholder="Describe your request…" aria-label="Request description">
    <button class="btn btn-gold btn-sm" onclick="App.doRequest('${esc(divId)}','${esc(divLabel)}')">Submit</button>

}

function toggleEditMode(pageId) {
  _editMode[pageId] = !_editMode[pageId];
  const btn  = document.getElementById('edit-btn-' + pageId);
  const page = document.getElementById('page-' + pageId);
  if (btn) {
    btn.classList.toggle('active', _editMode[pageId]);

  }
  if (page) {
    page.querySelectorAll('[data-editable]').forEach(el => {
      el.contentEditable = _editMode[pageId] ? 'true' : 'false';
      if (_editMode[pageId]) {
        // FIX #7: store original value on focus for dirty-check on blur
        el.addEventListener('focus', () => { _cellOriginals.set(el, el.textContent.trim()); }, { once: true });
      }
    });
    page.querySelectorAll('.add-row-btn').forEach(el => {
      el.style.display = _editMode[pageId] ? 'flex' : 'none';
    });
    page.querySelectorAll('.delete-row-btn').forEach(el => {
      el.style.display = _editMode[pageId] ? 'inline-block' : 'none';
    });
  }
  if (btn) btn.querySelector('span').textContent = _editMode[pageId] ? 'Done Editing' : 'Edit Mode';
}

// FIX #1 + #7: esc all values; skip save if value unchanged
function ec(value, path, field, recordId, placeholder) {
  const val = value || '';
  const ph  = placeholder || '—';
  // FIX #11: role="textbox" and aria-label for accessibility
  return `<span class="editable" contenteditable="false" role="textbox" aria-label="${esc(field)}"
    data-editable="1" data-path="${esc(path)}" data-field="${esc(field)}" data-id="${esc(String(recordId))}"
    data-placeholder="${esc(ph)}" data-orig="${esc(val)}"
    onblur="App.saveCell(this)"
    onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(val)}</span>`;
}

// FIX #7: Only save if value actually changed
async function saveCell(el) {
  const val  = el.textContent.trim();
  const orig = _cellOriginals.get(el) ?? el.dataset.orig ?? '';
  if (val === orig) return; // no change — skip the request
  const path  = el.dataset.path;
  const field = el.dataset.field;
  const id    = el.dataset.id;
  if (!path || !id) return;
  try {
    await apiPut(`${path}/${id}`, { [field]: val });
    el.dataset.orig = val;
    _cellOriginals.set(el, val);
    showSaved();
  } catch(e) {
    showToast('Save failed: ' + e.message);
    el.textContent = orig; // revert on failure
  }
}

// FIX #12: Normalize status strings before comparing
function statusSelect(current, path, id, options) {
  const opts = options || STATUS_OPTIONS;
  const normalize = s => String(s ?? '').trim().toLowerCase();
  const currentNorm = normalize(current);
  return `<select class="status-select" data-path="${esc(path)}" data-id="${esc(String(id))}"
    onchange="App.saveStatus(this)" aria-label="Status">
    ${opts.map(o => `<option value="${esc(o)}" ${normalize(o)===currentNorm?'selected':''}>${esc(o)}</option>`).join('')}
  </select>`;
}

async function saveStatus(el) {
  const val  = el.value;
  const path = el.dataset.path;
  const id   = el.dataset.id;
  try {
    await apiPut(`${path}/${id}`, { status: val });
    showSaved();
  } catch(e) { showToast('Save failed: ' + e.message); }
}

// FIX #6: Defer delete slightly so any in-flight blur save can settle
async function deleteRecord(path, id, reloader) {
  if (!confirm('Delete this record? This cannot be undone.')) return;
  // Small delay to let any active blur/save complete
  await new Promise(r => setTimeout(r, 80));
  try {
    await apiDel(`${path}/${id}`);
    reloader();
    showToast('Deleted');
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

/* ═══════════════════════════════════════════════════
   FIX #3: Force plain-text paste in all contenteditable cells
═══════════════════════════════════════════════════ */
document.addEventListener('paste', function(e) {
  if (e.target.matches('[contenteditable="true"]')) {
    e.preventDefault();
    const text = e.clipboardData.getData('text/plain');
    document.execCommand('insertText', false, text);
  }
});

function navigate(id) {

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const navEl  = document.getElementById('nav-' + id);

  if (navEl)  navEl.classList.add('active');
  if (pageEl) pageEl.classList.add('active');
  const d = divisions.find(x => x.id === id);
  document.getElementById('top-bar-label').textContent =
    d ? d.label + (d.sub ? ' — ' + d.sub : '') : 'LVO';
  const loaders = {
    overview:   loadOverview,   vindex:   loadVindex,
    operations: loadOperations, alliance: loadAlliance,
    obscura:    loadObscura,    capital:  loadCapital,
    custodia:   loadCustodia,   outreach: loadOutreach,
    alatus:     loadAlatus,     pedes:    loadPedes,
    petra:      loadPetra,      admin:    loadAdmin,
  };
  if (loaders[id]) loaders[id]();
}

function switchAdminTab(name, btn) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.getElementById('adm-' + name).classList.add('active');
  if (name === 'requests') loadAdminRequests();
  if (name === 'activity') loadAdminActivity();
}

async function loadOverview() {
  try {
    const [props, vehs, facs, partners, allocs, runs, builds] = await Promise.all([
      apiGet('/vindex/properties'), apiGet('/vindex/vehicles'),
      apiGet('/operations/facilities'), apiGet('/alliance/partners'),
      apiGet('/capital/allocations'), apiGet('/pedes/runs'),
      apiGet('/petra/builds')
    ]);
    document.getElementById('ov-kpis').innerHTML = `
      <div class="kpi-card"><div class="kpi-label">Properties</div><div class="kpi-value">${esc(String(props.length))}</div><div class="kpi-sub">A-Series</div></div>
      <div class="kpi-card"><div class="kpi-label">Vehicles</div><div class="kpi-value">${esc(String(vehs.length))}</div><div class="kpi-sub">B-Series fleet</div></div>
      <div class="kpi-card"><div class="kpi-label">Active Facilities</div><div class="kpi-value">${esc(String(facs.filter(f=>f.status==='Active').length))}</div><div class="kpi-sub">GRO operations</div></div>
      <div class="kpi-card"><div class="kpi-label">Alliance Partners</div><div class="kpi-value">${esc(String(partners.length))}</div><div class="kpi-sub gold">Active network</div></div>`;
    const divCards = [
      {id:'vindex',    name:'Vindex',     nick:'The Gasoline', note:`${props.length} properties · ${vehs.length} vehicles`},
      {id:'operations',name:'Operations', nick:'The Engine',   note:`${facs.filter(f=>f.status==='Active').length} active facilities`},
      {id:'alliance',  name:'Alliance',   nick:'The Brain',    note:`${partners.length} partners`},
      {id:'obscura',   name:'Obscura',    nick:'The Base',     note:'Web · Branding · 4K'},
      {id:'capital',   name:'Capital',    nick:'The Reservoir',note:`${allocs.filter(a=>a.status==='Active').length} active allocations`},
      {id:'custodia',  name:'Custodia',   nick:'The Guard',    note:'Security & transport'},
      {id:'outreach',  name:'Outreach',   nick:'The Heart',    note:'Donations · Scholarships'},
      {id:'alatus',    name:'Alatus',     nick:'The Wing',     note:'Aviation · Drones'},
      {id:'pedes',     name:'Pedes',      nick:'The Legs',     note:`${runs.filter(r=>r.status==='Active').length} active runs`},
      {id:'petra',     name:'Petra',      nick:'The Bedrock',  note:`${builds.filter(b=>b.status==='Active').length} active builds`},
    ];

        </div>
      </td>
      <td>${ec(b.budget,'/petra/builds','budget',b.id,'Budget')}</td>
      <td id="ps-${esc(String(b.id))}">${statusSelect(b.status,'/petra/builds',b.id,['Active','Pending','Completed','Blocked'])}</td>
      ${admin ? `<td><button class="btn-icon delete-row-btn" style="display:none" aria-label="Delete build ${esc(b.name||b.id)}" onclick="App.deleteRecord('/petra/builds',${esc(String(b.id))},App.loadPetra)">✕</button></td>` : ''}</tr>`).join('')
      : `<tr><td colspan="${admin?7:6}" class="loading-row">No builds yet — click Edit Mode to add</td></tr>`;
  } catch(e) { showToast('Petra load error: ' + e.message); }
}

async function updateProgress(id, input) {
  const val = Math.min(100, Math.max(0, parseInt(input.value) || 0));
  const bar = document.getElementById('pf-' + id);
  if (bar) bar.style.width = val + '%';
  try { await apiPut('/petra/builds/' + id, { progress: val }); showSaved(); } catch(e) { showToast('Error: ' + e.message); }
}

async function loadAdmin() { if (!_user?.isAdmin) return; loadAdminRequests(); }

async function loadAdminRequests() {
  try {
    const reqs = await apiGet('/requests');
    document.getElementById('adm-requests-tbody').innerHTML = reqs.length ? reqs.map(r => `<tr>
      <td>${esc(r.division)}</td>
      <td>${esc(r.type)}</td>
      <td style="max-width:240px;word-break:break-word">${esc(r.description)}</td>
      <td>${badge(r.status)}</td>
      <td style="color:var(--text-muted);font-size:10px">${esc(new Date(r.created_at).toLocaleDateString())}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-gold btn-sm" onclick="App.updateReqStatus(${esc(String(r.id))},'Complete')">Complete</button>
        <button class="btn btn-outline btn-sm" onclick="App.updateReqStatus(${esc(String(r.id))},'In Review')">Review</button>
      </td></tr>`).join('')
      : '<tr><td colspan="6" class="loading-row">No requests yet</td></tr>';

async function updateReqStatus(id, status) {
  try { await apiPut('/requests?id=' + id, { status }); loadAdminRequests(); showToast('Updated'); } catch(e) { showToast('Error: ' + e.message); }
}

async function loadAdminActivity() {
  try {
    const log = await apiGet('/activity');
    const el = document.getElementById('adm-activity-feed');
    if (!log.length) { el.innerHTML = '<div class="loading-row">No activity logged yet</div>'; return; }
    // FIX #1: esc() all dynamic values
    el.innerHTML = `<div class="activity-feed">${log.map(a => `
      <div class="activity-item">
        <div class="activity-dot" aria-hidden="true"></div>
        <div>
          <div class="activity-time">${esc(new Date(a.created_at).toLocaleString())}</div>
          <div class="activity-text">[${esc(a.division||'System')}] ${esc(a.action)}${a.actor?' · '+esc(a.actor):''}</div>
        </div>
      </div>`).join('')}</div>`;
  } catch(e) { showToast('Error: ' + e.message); }
}

  const d = divisions.find(x => x.id === divId);

  });

/* ═══════════════════════════════════════════════════
   CLERK AUTH
═══════════════════════════════════════════════════ */
window.addEventListener('load', async () => {
  try { await window.Clerk.load(); } catch(e) {
    document.getElementById('auth-guard-text').textContent = 'Auth error — redirecting…';
    setTimeout(() => window.location.href = LOGIN_URL, 1500);
    return;
  }

  if (!window.Clerk.user) { window.location.href = LOGIN_URL; return; }

  const user = window.Clerk.user;
  const meta = user.publicMetadata || {};
  const displayName = user.firstName
    ? user.firstName + (user.lastName ? ' ' + user.lastName[0] + '.' : '')
    : (user.primaryEmailAddress?.emailAddress || 'User');

  _user = {
    uid:     user.id,
    name:    displayName,
    // FIX #2: isAdmin determined from Clerk public metadata (set server-side only)
    // The Worker must also independently verify this from the JWT — never trust a request header
    isAdmin: meta.role === 'admin',
    token:   null,
  };

  document.getElementById('sidebar-user-name').textContent = displayName;
  document.getElementById('auth-guard').style.display = 'none';
  document.getElementById('app').classList.add('visible');

  window.Clerk.mountUserButton(document.getElementById('clerk-topbar-btn'), { appearance: CLERK_APPEARANCE });
  window.Clerk.mountUserButton(document.getElementById('clerk-user-btn'),   { appearance: CLERK_APPEARANCE });

  // Wire modal overlay click-to-close and button click handlers (event-based, avoids inline onclick for these)
  document.getElementById('modal-overlay').addEventListener('click', closeModalOnOverlay);
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  document.getElementById('notif-close-btn').addEventListener('click', toggleNotifPanel);
  document.getElementById('notif-toggle-btn').addEventListener('click', toggleNotifPanel);

  // Close modal on Escape key; FIX #11: keyboard trap
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('modal-overlay');
      if (overlay.classList.contains('open')) closeModal();
      if (notifOpen) toggleNotifPanel();
    }
  });

  initApp();

  window.Clerk.addListener(({ user }) => { if (!user) window.location.href = LOGIN_URL; });
});
